<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte de Visite — DG-Dev</title>
    <link rel="icon" href="/images/visit-card/Logo3 DG-Dev36x36.png" type="image/png">
    <link rel="stylesheet" href="/vCard/vCard-DG-Dev.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>

    <div class="vc-card">

        <div class="vc-cover">
            <img src="/images/visit-card/couverture-DG-Dev.png" alt="">
        </div>

        <div class="vc-header">
            <h1 class="vc-name">Dimitri Garrigues</h1>
            <p class="vc-role">Web Développeur</p>
            <p class="vc-sub">DG-Dev</p>
        </div>

        <div class="vc-section">
            <div class="vc-row">
                <span class="vc-icon">📍</span>
                <span class="vc-text">305 Avenue Général Gouraud<br>83200 Toulon</span>
            </div>
            <div class="vc-row">
                <span class="vc-icon">✉️</span>
                <span class="vc-text">dimitrigarrigues@gmail.com</span>
                <a class="vc-action" href="mailto:dimitrigarrigues@gmail.com">Mail</a>
            </div>
            <div class="vc-row">
                <span class="vc-icon">📱</span>
                <span class="vc-text">06 03 89 19 71</span>
                <a class="vc-action" href="tel:+33603891971">Appeler</a>
            </div>
        </div>

        <div class="vc-section">
            <a class="vc-btn-dl" href="/vCard/DG-Dev.vcf" download>⬇ Télécharger le contact</a>
        </div>

        <div class="vc-section">
            <p class="vc-section-title">Mes réseaux</p>
            <div class="vc-socials">
                <a class="vc-social-btn" href="https://www.linkedin.com/in/dimitri-garrigues-4b76a317b/" target="_blank" rel="noopener">
                    <img src="/images/social/Linkedin-mini.png" alt="">LinkedIn
                </a>
                <a class="vc-social-btn" href="https://github.com/Dim-Vlad" target="_blank" rel="noopener">
                    <img src="/images/social/Github-mini.png" alt="">GitHub
                </a>
                <a class="vc-social-btn" href="https://www.reddit.com/user/AsleepAd420/" target="_blank" rel="noopener">
                    <img src="/images/social/Reddit.png" alt="">Reddit
                </a>
            </div>
        </div>

        <div class="vc-section vc-qr">
            <p class="vc-section-title">Scanner pour me contacter</p>
            <img class="vc-qr-img" src="/vCard/qr-code-DG-Dev.png" alt="QR Code">
        </div>

        <div class="vc-back">
            <a href="/index.html">← Retour au site</a>
        </div>

    </div>

</body>
</html>
