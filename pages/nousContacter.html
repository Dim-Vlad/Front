<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nous contacter - VBO</title>
    <link href="/css/styles.css?v=20260705" rel="stylesheet">
    <link rel="stylesheet" href="/css/nousContacter.css?v=20260623">
    <link rel="icon" href="/images/favicon-36x36.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="menu"></div>

    <div id="content">
        <div class="header-content">
            <img class="logo-club" src="/images/logo-club/LogoVBO.png" alt="Logo du club">
            <div class="text-content">
                <h1>Nous contacter</h1>
                <p>Vous pouvez prendre contact avec nous en remplissant ce formulaire.<br>
                Pour venir nous voir, suivez les liens ci-dessous.</p>
            </div>
        </div>
    </div>

    <main class="contact-main">
        <div class="contact-grid">

            <!-- ── Formulaire ── -->
            <section class="contact-card">
                <h2 class="contact-card-title">Formulaire de contact</h2>
                <form id="contact-form" action="/php/contact/send_mail_contact.php" method="post">
                    <div class="form-field">
                        <label for="fname">Nom</label>
                        <input type="text" id="fname" name="lastname" placeholder="Mon nom…" required>
                    </div>
                    <div class="form-field">
                        <label for="lname">Prénom</label>
                        <input type="text" id="lname" name="firstname" placeholder="Mon prénom…" required>
                    </div>
                    <div class="form-field">
                        <label for="phone">Téléphone</label>
                        <input type="tel" id="phone" name="phone" placeholder="06 12 34 56 78" required>
                    </div>
                    <div class="form-field">
                        <label for="mail">E-mail</label>
                        <input type="email" id="mail" name="mail" placeholder="mon.mail@mail.com" required>
                    </div>
                    <div class="form-field">
                        <label for="subject-dropdown">Objet</label>
                        <select id="subject-dropdown" name="subject-dropdown" required>
                            <option value="" disabled selected>Choisissez l'objet</option>
                            <option value="Général">Demande d'information - Générale</option>
                            <option value="Entrainements">Entrainements</option>
                            <option value="Stage">Stages vacances</option>
                            <option value="Loto">Loto</option>
                            <option value="Partenaire">Partenaire - Je souhaite devenir partenaire</option>
                            <option value="Commissions">Commissions - Je voudrais plus d'information</option>
                            <option value="Feedback">Retour d'expérience du site</option>
                        </select>
                    </div>
                    <div class="form-field form-field-textarea">
                        <label for="subject">Message</label>
                        <textarea id="subject" name="subject" placeholder="Bonjour, je voudrais des renseignements sur…" rows="6" required></textarea>
                    </div>
                    <div id="form-status" class="form-status" style="display:none"></div>
                    <div class="form-submit-row">
                        <button type="submit" class="btn-send" id="btn-send">Envoyer</button>
                    </div>
                </form>
            </section>

            <!-- ── Carte + Adresses ── -->
            <div class="right-col">
                <div class="map-card">
                    <iframe title="Carte des gymnases VBO"
                        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d5822.942177210254!2d5.846950039566753!3d43.13663599912857!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2sfr!4v1722042914782!5m2!1sfr!2sfr"
                        allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>

                <div class="addresses-card">
                    <h2 class="contact-card-title">Nos adresses</h2>
                    <div class="address-list">
                        <a href="https://maps.app.goo.gl/5ba5onV5EHCqze6m9" target="_blank" class="address-link">
                            <span class="addr-icon">🏢</span>
                            <span>Siège social</span>
                        </a>
                        <a href="https://maps.app.goo.gl/Aa3LosRUZM7QG6B68" target="_blank" class="address-link">
                            <span class="addr-icon">🏐</span>
                            <span>Gymnase Piemontesi, Parking Orlandi 1</span>
                        </a>
                        <a href="https://maps.app.goo.gl/GbgXnTr8EQxSmCnt6" target="_blank" class="address-link">
                            <span class="addr-icon">🏐</span>
                            <span>Gymnase Charles Coste (ex-Vallon)</span>
                        </a>
                        <a href="https://maps.app.goo.gl/AUNfpeh4rVn3smVX8" target="_blank" class="address-link">
                            <span class="addr-icon">🏐</span>
                            <span>Gymnase de La Cordeille</span>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div id="footer"></div>

    <script src="/js/main.js?v=20260705"></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn    = document.getElementById('btn-send');
            const status = document.getElementById('form-status');
            btn.disabled    = true;
            btn.textContent = 'Envoi en cours…';
            status.style.display = 'none';

            try {
                const res = await fetch('/php/contact/send_mail_contact.php', {
                    method: 'POST',
                    body: new FormData(this)
                });
                if (!res.ok) throw new Error();
                status.textContent   = '✓ Votre message a été envoyé avec succès !';
                status.className     = 'form-status success';
                status.style.display = 'block';
                this.reset();
            } catch {
                status.textContent   = '✗ Une erreur est survenue. Veuillez réessayer.';
                status.className     = 'form-status error';
                status.style.display = 'block';
            } finally {
                btn.disabled    = false;
                btn.textContent = 'Envoyer';
            }
        });
    </script>
</body>
</html>
