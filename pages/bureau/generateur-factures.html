<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Générateur de factures</title>
<link rel="icon" href="/images/logo-club/favicon-36x36.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---- Identité visuelle du VBO : vert du club, Poppins, papier A4 blanc ---- */
  :root{
    --accent:#063E0B;         /* vert du club (identité du site) */
    --accent-dark:#0a5512;
    --ink:#223224;            /* encre, texte principal */
    --muted:#666666;          /* texte secondaire */
    --line:#e0e8e0;           /* filets */
    --bg:#f3f6f3;             /* fond atelier */
    --panel:#ffffff;          /* panneaux + papier */
    --field:#f7f9f7;          /* champs */
    --danger:#c0392b;
    --radius:12px;
    --sans:"Poppins",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e6ece6; --muted:#aab8ab; --line:#33402f;
      --bg:#141c13; --panel:#1b2419; --field:#172015; --accent:#7fc77f; --accent-dark:#5ea15e;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--bg);
    font-size:14px; line-height:1.5;
  }
  button{font-family:inherit}

  /* ====== Barre d'outils ====== */
  .toolbar{
    position:sticky; top:0; z-index:20;
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .toolbar h1{
    font-size:16px; margin:0; font-weight:700; letter-spacing:.2px;
    display:flex; align-items:center; gap:8px; color:var(--ink);
  }
  .toolbar .logo-badge{
    width:28px; height:28px; border-radius:7px; background:#fff;
    border:1px solid var(--line); object-fit:contain; padding:2px; display:block;
  }
  .toolbar .spacer{flex:1}
  .btn{
    border:1.5px solid var(--line); background:var(--field); color:var(--accent);
    padding:9px 16px; border-radius:20px; cursor:pointer; font-size:13px; font-weight:700;
    text-decoration:none; display:inline-flex; align-items:center;
    transition:background .15s, border-color .15s;
  }
  .btn:hover{background:var(--line); border-color:var(--accent)}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn-primary:hover{background:var(--accent-dark); border-color:var(--accent-dark)}

  /* ====== Mise en page atelier ====== */
  .wrap{
    display:grid; grid-template-columns:minmax(320px,380px) 1fr; gap:22px;
    padding:22px max(16px,env(safe-area-inset-left)) 60px max(16px,env(safe-area-inset-right));
    align-items:start; max-width:1400px; margin:0 auto;
  }
  @media (max-width:900px){ .wrap{grid-template-columns:1fr} }

  /* ====== Panneau de formulaire ====== */
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .panel-head{
    padding:11px 16px; background:var(--field); border-bottom:1px solid var(--line);
    font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--accent);
  }
  .panel-body{padding:16px; display:flex; flex-direction:column; gap:13px}
  .sidebar{position:sticky; top:66px; display:flex; flex-direction:column; gap:18px}
  @media (max-width:900px){ .sidebar{position:static} }

  label{font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:4px}
  input,textarea,select{
    width:100%; font-family:inherit; font-size:14px; color:var(--ink);
    background:var(--field); border:1px solid var(--line); border-radius:7px; padding:8px 10px;
  }
  input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(6,62,11,.08)}
  textarea{resize:vertical; min-height:44px; overflow:hidden}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .field-logo{display:flex; align-items:center; gap:10px}
  .field-logo img{width:46px; height:46px; object-fit:contain; border:1px solid var(--line); border-radius:6px; background:#fff}

  .chk{
    display:flex; align-items:center; gap:9px; cursor:pointer;
    padding:9px 12px; border:1.5px solid var(--line); border-radius:8px; background:var(--field);
    font-size:13px; font-weight:600; color:var(--ink); margin-top:2px;
  }
  .chk input{width:17px; height:17px; accent-color:var(--accent); cursor:pointer; flex:0 0 auto}
  .chk span{font-size:inherit; font-weight:inherit; color:inherit; text-transform:none; letter-spacing:normal}

  /* ====== Lignes ====== */
  #lines{display:flex; flex-direction:column; gap:12px}
  .line{
    display:flex; flex-direction:column; gap:9px;
    padding:12px; border:1px solid var(--line); border-radius:9px; background:var(--field);
  }
  .line .l-desc{
    width:100%; background:var(--panel); min-height:40px; overflow:hidden; resize:vertical;
    font-weight:600; line-height:1.4;
  }
  .line-row{display:flex; align-items:flex-end; gap:10px}
  .mini{flex:1; font-size:11px; font-weight:600; color:var(--muted); display:flex; flex-direction:column; gap:3px; margin-bottom:0}
  .mini input{width:100%; padding:7px 9px}
  .line .num{text-align:right; font-variant-numeric:tabular-nums}
  .line-row .icon-btn{flex:0 0 auto; align-self:stretch; height:auto}
  .icon-btn{
    border:1.5px solid var(--line); background:var(--field); color:var(--danger);
    width:34px; height:34px; border-radius:7px; cursor:pointer; font-size:17px; line-height:1;
    transition:background .15s, border-color .15s;
  }
  .icon-btn:hover{background:var(--danger); border-color:var(--danger); color:#fff}

  .hint{font-size:11.5px; color:var(--muted); margin-top:2px}

  /* ====== Aperçu facture (papier A4) ====== */
  .paper-scroll{overflow:auto}
  .facture{
    position:relative; background:#fff; color:#1c2528; width:210mm; min-height:297mm; margin:0 auto;
    padding:18mm 16mm; box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 30px rgba(0,0,0,.08);
    font-size:13px; line-height:1.55;
  }
  .facture *{color:inherit}
  .fac-stamp{
    position:absolute; top:52mm; right:18mm; z-index:1;
    border:3.5px solid var(--accent); border-radius:10px; color:var(--accent);
    font-size:22px; font-weight:800; letter-spacing:3px; text-transform:uppercase;
    padding:6px 18px; transform:rotate(-10deg); opacity:.85;
  }
  .fac-top{display:flex; justify-content:space-between; gap:24px; align-items:flex-start}
  .fac-emetteur{max-width:60%}
  .fac-logo{max-width:150px; max-height:80px; object-fit:contain; margin-bottom:8px; display:block}
  .fac-club{font-size:17px; font-weight:800; color:#1c2528}
  .fac-emetteur .meta{white-space:pre-line; color:#45555a; margin-top:3px}
  .fac-title{text-align:right}
  .fac-title h2{margin:0; font-size:30px; letter-spacing:2px; color:var(--accent); text-transform:uppercase}
  .fac-title .fac-num{margin-top:4px; font-weight:700}
  .fac-title .dates{margin-top:8px; color:#45555a; font-size:12.5px}
  .fac-title .dates b{color:#1c2528}

  .fac-client{
    margin:26px 0 20px; padding:14px 16px; border:1px solid #e3e8e7; border-radius:8px; background:#fafbfb;
    max-width:62%;
  }
  .fac-client .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:#7a898d; font-weight:700}
  .fac-client .nom{font-weight:700; font-size:15px; margin-top:3px}
  .fac-client .adr{white-space:pre-line; color:#45555a; margin-top:2px}

  table.fac-lignes{width:100%; border-collapse:collapse; margin-top:4px}
  table.fac-lignes th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.6px;
    color:#fff; background:var(--accent); padding:9px 10px; font-weight:700;
  }
  table.fac-lignes th.r,table.fac-lignes td.r{text-align:right}
  table.fac-lignes td{padding:9px 10px; border-bottom:1px solid #e9eeed; vertical-align:top}
  table.fac-lignes td.num{font-variant-numeric:tabular-nums; white-space:nowrap}

  .fac-totaux{display:flex; justify-content:flex-end; margin-top:16px}
  .fac-totaux table{border-collapse:collapse; min-width:260px}
  .fac-totaux td{padding:6px 10px; font-variant-numeric:tabular-nums}
  .fac-totaux td.lbl{color:#45555a}
  .fac-totaux td.val{text-align:right; font-weight:600}
  .fac-totaux tr.ttc td{
    border-top:2px solid var(--accent); font-size:16px; font-weight:800; padding-top:9px; color:var(--accent);
  }

  .fac-paiement{margin-top:26px; display:flex; flex-wrap:wrap; gap:26px}
  .fac-paiement .block{flex:1; min-width:180px}
  .fac-paiement .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:#7a898d; font-weight:700; margin-bottom:3px}
  .fac-paiement .txt{white-space:pre-line; color:#45555a}

  .fac-mentions{margin-top:22px; padding-top:12px; border-top:1px solid #e9eeed; color:#7a898d; font-size:11px; white-space:pre-line}

  .empty-note{color:#9aa7ab; font-style:italic}

  /* ====== Impression ====== */
  @media print{
    @page{size:A4; margin:0}
    body{background:#fff}
    .toolbar,.sidebar,.panel-controls,.no-print{display:none !important}
    .wrap{display:block; padding:0; margin:0; max-width:none}
    .paper-scroll{overflow:visible}
    .facture{width:auto; min-height:auto; margin:0; box-shadow:none; padding:16mm 14mm}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <h1><img class="logo-badge" id="badge" src="/images/logo-club/favicon-36x36.png" alt="Logo VBO"> Générateur de factures</h1>
  <div class="spacer"></div>
  <a class="btn" href="/pages/auth/tableau-de-bord.php">← Retour au site</a>
  <button class="btn" id="btnSave" title="Mémoriser les infos du club dans ce navigateur">💾 Mémoriser le club</button>
  <button class="btn" id="btnReset" title="Nouvelle facture vierge">🗑 Nouvelle facture</button>
  <button class="btn-primary btn" id="btnPrint">🖨 Imprimer / PDF</button>
</div>

<div class="wrap">
  <!-- ================= FORMULAIRE ================= -->
  <div class="sidebar">

    <div class="panel">
      <div class="panel-head">Le club (émetteur)</div>
      <div class="panel-body">
        <div>
          <label>Logo du club (optionnel)</label>
          <div class="field-logo">
            <img id="logoPreview" alt="" hidden>
            <input type="file" id="f_logo" accept="image/*">
          </div>
        </div>
        <div>
          <label for="f_club">Nom du club</label>
          <input id="f_club" placeholder="Association Sportive de ...">
        </div>
        <div>
          <label for="f_emetteur">Adresse / contact</label>
          <textarea id="f_emetteur" placeholder="12 rue du Stade&#10;75000 Ville&#10;Tél. 01 23 45 67 89&#10;contact@club.fr"></textarea>
        </div>
        <div>
          <label for="f_siret">SIRET / RNA (optionnel)</label>
          <input id="f_siret" placeholder="N° SIRET ou RNA (W...)">
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">Facture</div>
      <div class="panel-body">
        <div class="row2">
          <div>
            <label for="f_num">N° de facture</label>
            <input id="f_num" placeholder="2026-001">
          </div>
          <div>
            <label for="f_date">Date</label>
            <input id="f_date" type="date">
          </div>
        </div>
        <div>
          <label for="f_echeance">Échéance (optionnel)</label>
          <input id="f_echeance" type="date">
        </div>
        <label class="chk" for="f_payee">
          <input type="checkbox" id="f_payee">
          <span>Facture payée</span>
        </label>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">Client / adhérent</div>
      <div class="panel-body">
        <div>
          <label for="f_cli_nom">Nom</label>
          <input id="f_cli_nom" placeholder="Nom du destinataire">
        </div>
        <div>
          <label for="f_cli_adr">Adresse (optionnel)</label>
          <textarea id="f_cli_adr" placeholder="Adresse du client"></textarea>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">Lignes</div>
      <div class="panel-body">
        <div id="lines"></div>
        <button class="btn" id="btnAddLine" style="align-self:flex-start">+ Ajouter une ligne</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">TVA & mentions</div>
      <div class="panel-body">
        <div>
          <label for="f_regime">Régime de TVA</label>
          <select id="f_regime">
            <option value="franchise">Association — TVA non applicable (art. 293 B du CGI)</option>
            <option value="tva">Assujetti à la TVA</option>
          </select>
        </div>
        <div id="tvaRateWrap" hidden>
          <label for="f_tva">Taux de TVA (%)</label>
          <input id="f_tva" type="number" step="0.1" min="0" value="20">
        </div>
        <div>
          <label for="f_paiement">Modalités de paiement</label>
          <textarea id="f_paiement" placeholder="Par chèque à l'ordre du club&#10;ou virement IBAN FR76 ...">Par virement ou chèque à l'ordre du club.</textarea>
        </div>
        <div>
          <label for="f_rib">Coordonnées bancaires (RIB)</label>
          <textarea id="f_rib" placeholder="Titulaire : ...&#10;IBAN : ...&#10;BIC : ..."></textarea>
        </div>
        <div>
          <label for="f_mentions">Mentions de bas de page</label>
          <textarea id="f_mentions"></textarea>
        </div>
      </div>
    </div>

  </div>

  <!-- ================= APERÇU ================= -->
  <div class="paper-scroll">
    <div class="facture" id="facture">
      <div class="fac-stamp" id="o_stamp" hidden>Payée</div>
      <div class="fac-top">
        <div class="fac-emetteur">
          <img class="fac-logo" id="o_logo" alt="" hidden>
          <div class="fac-club" id="o_club">Nom du club</div>
          <div class="meta" id="o_emetteur"></div>
          <div class="meta" id="o_siret"></div>
        </div>
        <div class="fac-title">
          <h2>Facture</h2>
          <div class="fac-num" id="o_num"></div>
          <div class="dates" id="o_dates"></div>
        </div>
      </div>

      <div class="fac-client">
        <div class="lbl">Facturé à</div>
        <div class="nom" id="o_cli_nom">—</div>
        <div class="adr" id="o_cli_adr"></div>
      </div>

      <table class="fac-lignes">
        <thead>
          <tr>
            <th>Désignation</th>
            <th class="r">Qté</th>
            <th class="r">Prix unit.</th>
            <th class="r">Montant</th>
          </tr>
        </thead>
        <tbody id="o_lignes"></tbody>
      </table>

      <div class="fac-totaux">
        <table>
          <tr id="o_row_ht"><td class="lbl">Total HT</td><td class="val" id="o_ht"></td></tr>
          <tr id="o_row_tva"><td class="lbl" id="o_tva_lbl">TVA</td><td class="val" id="o_tva"></td></tr>
          <tr class="ttc"><td class="lbl" id="o_ttc_lbl">Total à régler</td><td class="val" id="o_ttc"></td></tr>
        </table>
      </div>

      <div class="fac-paiement">
        <div class="block">
          <div class="lbl">Règlement</div>
          <div class="txt" id="o_paiement"></div>
        </div>
        <div class="block" id="o_rib_block" hidden>
          <div class="lbl">Coordonnées bancaires</div>
          <div class="txt" id="o_rib"></div>
        </div>
      </div>

      <div class="fac-mentions" id="o_mentions"></div>
    </div>
  </div>
</div>

  var euro=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
  var $=function(id){return document.getElementById(id);};

  /* ---------- Lignes ---------- */
  var lines=$("lines");
  function addLine(desc,qte,pu){
    var row=document.createElement("div");
    row.className="line";
    row.innerHTML=
      '<textarea class="l-desc" rows="1" placeholder="Désignation : cotisation, stage, équipement..."></textarea>'+
      '<div class="line-row">'+
        '<label class="mini">Quantité<input class="l-qte num" type="number" step="1" min="0" value="1"></label>'+
        '<label class="mini">Prix unitaire €<input class="l-pu num" type="number" step="0.01" min="0" value="0"></label>'+
        '<button class="icon-btn" title="Supprimer cette ligne">×</button>'+
      '</div>';
    row.querySelector(".l-desc").value=desc||"";
    if(qte!=null) row.querySelector(".l-qte").value=qte;
    if(pu!=null) row.querySelector(".l-pu").value=pu;
    row.querySelector(".icon-btn").addEventListener("click",function(){row.remove();render();});
    row.addEventListener("input",render);
    lines.appendChild(row);
    autoGrow(row.querySelector(".l-desc"));
  }

  /* ---------- Rendu de l'aperçu ---------- */
  function render(){
    var club=$("f_club").value.trim();
    $("o_club").textContent=club||"Nom du club";
    $("badge").textContent=(club||"F").trim().charAt(0).toUpperCase()||"F";

    $("o_emetteur").textContent=$("f_emetteur").value;
    var siret=$("f_siret").value.trim();
    $("o_siret").textContent=siret?("N° SIRET : "+siret):"";

    $("o_num").textContent=$("f_num").value?("N° "+$("f_num").value):"";

    var d=$("f_date").value, e=$("f_echeance").value, dates="";
    if(d) dates+="Date : <b>"+frDate(d)+"</b>";
    if(e) dates+=(dates?"<br>":"")+"Échéance : <b>"+frDate(e)+"</b>";
    $("o_dates").innerHTML=dates;

    $("o_cli_nom").textContent=$("f_cli_nom").value.trim()||"—";
    $("o_cli_adr").textContent=$("f_cli_adr").value;

    $("o_stamp").hidden=!$("f_payee").checked;

    // lignes + total HT
    var tbody=$("o_lignes"); tbody.innerHTML="";
    var ht=0, rows=lines.querySelectorAll(".line"), any=false;
    rows.forEach(function(r){
      var desc=r.querySelector(".l-desc").value.trim();
      var qte=parseFloat(r.querySelector(".l-qte").value)||0;
      var pu=parseFloat(r.querySelector(".l-pu").value)||0;
      if(!desc && !qte && !pu) return;
      var montant=qte*pu; ht+=montant; any=true;
      var tr=document.createElement("tr");
      tr.innerHTML="<td>"+escapeHtml(desc||"—")+"</td>"+
        '<td class="r num">'+formatQte(qte)+"</td>"+
        '<td class="r num">'+euro.format(pu)+"</td>"+
        '<td class="r num">'+euro.format(montant)+"</td>";
      tbody.appendChild(tr);
    });
    if(!any){
      tbody.innerHTML='<tr><td colspan="4" class="empty-note">Ajoutez des lignes dans le panneau de gauche…</td></tr>';
    }

    // TVA
    var regime=$("f_regime").value;
    var rowTva=$("o_row_tva");
    if(regime==="tva"){
      var taux=parseFloat($("f_tva").value)||0;
      var tva=ht*taux/100, ttc=ht+tva;
      $("o_row_ht").hidden=false; rowTva.hidden=false;
      $("o_ht").textContent=euro.format(ht);
      $("o_tva_lbl").textContent="TVA ("+formatQte(taux)+" %)";
      $("o_tva").textContent=euro.format(tva);
      $("o_ttc_lbl").textContent="Total TTC à régler";
      $("o_ttc").textContent=euro.format(ttc);
    }else{
      $("o_row_ht").hidden=true; rowTva.hidden=true;
      $("o_ttc_lbl").textContent="Total à régler";
      $("o_ttc").textContent=euro.format(ht);
    }

    $("o_paiement").textContent=$("f_paiement").value;

    var rib=$("f_rib").value.trim();
    $("o_rib_block").hidden=!rib;
    $("o_rib").textContent=rib;

    var mentions=$("f_mentions").value;
    if(regime!=="tva"){
      var legal="TVA non applicable, art. 293 B du CGI.";
      mentions=mentions ? (mentions.indexOf(legal)<0 ? mentions+"\n"+legal : mentions) : legal;
    }
    $("o_mentions").textContent=mentions;
  }

  function frDate(iso){
    var p=iso.split("-"); if(p.length!==3) return iso;
    return p[2]+"/"+p[1]+"/"+p[0];
  }
  function formatQte(n){ return (Math.round(n*100)/100).toLocaleString("fr-FR"); }
  function escapeHtml(s){ return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  /* ---------- Logo ---------- */
  $("f_logo").addEventListener("change",function(){
    var file=this.files[0];
    if(!file){ setLogo(""); return; }
    var reader=new FileReader();
    reader.onload=function(){ setLogo(reader.result); };
    reader.readAsDataURL(file);
  });
  function setLogo(dataUrl){
    var p=$("logoPreview"), o=$("o_logo");
    if(dataUrl){ p.src=dataUrl; p.hidden=false; o.src=dataUrl; o.hidden=false; }
    else{ p.hidden=true; o.hidden=true; }
  }

  /* ---------- Régime ---------- */
  $("f_regime").addEventListener("change",function(){
    $("tvaRateWrap").hidden = this.value!=="tva";
    render();
  });

  /* ---------- Sauvegarde du club (localStorage) ---------- */
  function saveClub(){
    try{
      localStorage.setItem(STORE,JSON.stringify({
        club:$("f_club").value, emetteur:$("f_emetteur").value, siret:$("f_siret").value,
        rib:$("f_rib").value, regime:$("f_regime").value, tva:$("f_tva").value,
        paiement:$("f_paiement").value, mentions:$("f_mentions").value,
        logo:$("o_logo").src && !$("o_logo").hidden ? $("o_logo").src : ""
      }));
      flash($("btnSave"),"✓ Mémorisé");
    }catch(e){ flash($("btnSave"),"Indisponible"); }
  }
  function loadClub(){
    // Valeurs du club pré-remplies de base
    $("f_club").value=CLUB.nom;
    $("f_emetteur").value=CLUB.adresse;
    $("f_siret").value=CLUB.siret;
    $("f_rib").value=CLUB.rib||"";
    if(CLUB.logo && CLUB.logo.indexOf("data:")===0) setLogo(CLUB.logo);
    // Écrase avec la version mémorisée dans ce navigateur, si elle existe
    try{
      var raw=localStorage.getItem(STORE); if(!raw) return;
      var d=JSON.parse(raw);
      if(d.club!=null) $("f_club").value=d.club;
      if(d.emetteur!=null) $("f_emetteur").value=d.emetteur;
      if(d.siret!=null) $("f_siret").value=d.siret;
      if(d.rib!=null) $("f_rib").value=d.rib;
      if(d.regime) $("f_regime").value=d.regime;
      if(d.tva) $("f_tva").value=d.tva;
      if(d.paiement) $("f_paiement").value=d.paiement;
      if(d.mentions!=null) $("f_mentions").value=d.mentions;
      if(d.logo) setLogo(d.logo);
      $("tvaRateWrap").hidden=$("f_regime").value!=="tva";
    }catch(e){}
  }
  function flash(btn,txt){
    var old=btn.textContent; btn.textContent=txt;
    setTimeout(function(){btn.textContent=old;},1400);
  }

  /* ---------- Nouvelle facture ---------- */
  function resetFacture(){
    $("f_num").value=suggestNum();
    $("f_date").value=todayISO(); $("f_echeance").value="";
    $("f_cli_nom").value=""; $("f_cli_adr").value="";
    $("f_payee").checked=false;
    lines.innerHTML=""; addLine("",1,0);
    render();
    growAll();
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function suggestNum(){
    var y=new Date().getFullYear();
    return y+"-001";
  }

  /* ---------- Init ---------- */
  /* ---------- Textareas qui s'agrandissent avec leur contenu ---------- */
  function autoGrow(el){ el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
  function growAll(){
    var tas=document.querySelectorAll(".sidebar textarea");
    for(var i=0;i<tas.length;i++) autoGrow(tas[i]);
  }
  document.addEventListener("input",function(e){
    if(e.target.tagName==="TEXTAREA") autoGrow(e.target);
    if(e.target.closest(".sidebar")) render();
  });
  $("btnAddLine").addEventListener("click",function(){ addLine("",1,0); render(); });
  $("btnSave").addEventListener("click",saveClub);
  $("btnReset").addEventListener("click",resetFacture);
  $("btnPrint").addEventListener("click",function(){ window.print(); });

  loadClub();
  $("f_date").value=todayISO();
  $("f_num").value=suggestNum();
  // Exemple de départ (effacé à "Nouvelle facture")
  addLine("Cotisation annuelle 2026",1,150);
  addLine("Stage de perfectionnement",1,45);
  render();
  growAll();
})();
</script>
</body>
</html>
