};
window.setDist=(m)=>{ state.config.distribution=m; rebuildPools(); screens.assignPools(); };
// Étape 6 : on ne valide que si la répartition est correcte
window.validateAssign=()=>{
  const n=state.teams.length, p=state.config.pools, t=state.config.teamsPerPool, cap=p*t;
  const placed=state.pools.reduce((s,pl)=>s+pl.teams.length,0);
  // On ne bloque QUE s'il y a moins de places que d'équipes (des équipes resteraient non placées).
  // Des places vides (cap > n) sont autorisées.
  if(p>1 && cap<n){ toast(`⚠ ${n-cap} équipe(s) non placée(s) — augmentez le format`); return; }
  if(placed!==n){ toast(`⚠ ${n-placed} équipe(s) ne sont pas placées`); return; }
  if(state.pools.some(pl=>pl.teams.length<2)){ toast('⚠ Chaque poule doit avoir au moins 2 équipes'); return; }
  go('summary');
};
window.setPoolFormat=()=>{
  const pEl=document.getElementById('ap_pools'), tEl=document.getElementById('ap_tpp');
  const p=Math.max(1,Math.min(16,parseInt(pEl&&pEl.value)||1));
  let t;
  if(p===1){ t=Math.max(2,state.teams.length); }                       // poule unique = championnat, toutes les équipes
  else if(tEl){ t=Math.max(2,Math.min(8,parseInt(tEl.value)||2)); }
  else { t=Math.max(2,Math.min(8,Math.ceil(state.teams.length/p))); }   // retour depuis la poule unique : format cohérent
  state.config.pools=p;
  state.config.teamsPerPool=t;
  rebuildPools(); screens.assignPools();
};
window.autoFitPools=()=>{
  const n=state.teams.length;
  const good=[4,3,5,6,2].find(t=>n%t===0 && n/t>=2 && n/t<=16);
  let tpp, pools;
  if(good){ tpp=good; pools=n/tpp; }
  else { tpp=4; pools=Math.max(2,Math.min(16,Math.ceil(n/4))); }
  state.config.teamsPerPool=tpp; state.config.pools=pools;
  rebuildPools(); screens.assignPools();
  toast('Format ajusté : '+pools+' poules × '+tpp+' équipes');
};
function updatePoolFit(){
  const el=document.getElementById('poolFit'); if(!el) return;
  const n=state.teams.length, p=state.config.pools, t=state.config.teamsPerPool, cap=p*t;
  let msg;
  if(p===1) msg=`<span class="badge ok">🏆 Poule unique — championnat : les ${n} équipes se rencontrent toutes</span>`;
  else if(cap===n) msg=`<span class="badge ok">✓ Les ${n} équipes rentrent parfaitement (${p} × ${t})</span>`;
  else if(cap>n) msg=`<span class="badge warn">⚠ ${cap} places pour ${n} équipes — ${cap-n} place(s) vide(s), poules inégales</span>`;
  else msg=`<span class="badge warn">⚠ ${cap} places pour ${n} équipes — ${n-cap} équipe(s) ne seront pas placées, augmentez le format</span>`;
  el.innerHTML=msg;
}
window.setPoolCourt=(letter,v)=>{ const p=state.pools.find(x=>x.letter===letter); if(p) p.court=+v; };
window.moveTeam=(from,name,to)=>{
  if(from===to) return;
  const pf=state.pools.find(p=>p.letter===from), pt=state.pools.find(p=>p.letter===to);
  if(!pf||!pt) return;
  const idx=pf.teams.findIndex(x=>x.t===name); if(idx<0) return;
  const [tm]=pf.teams.splice(idx,1); pt.teams.push(tm);
  state.phasePrincipal=null; state.phaseConsolante=null; state._phase2Edited=false; buildSchedule();
  screens.assignPools(); toast(name+' → Poule '+to);
};

  const el=document.getElementById('distHelp'); if(!el) return;

}

// Copie dans le presse-papier (avec repli pour les navigateurs/contextes sans API)
async function copyText(txt){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(txt); return true; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok; }catch(e){ return false; }
}
window.copyJoinCode=async(code)=>{ const ok=await copyText(code); toast(ok?'✓ Code '+code+' copié':'Code : '+code); };
window.shareJoin=async(code,url)=>{
  const data={ title:C.name||'Tournoi', text:`Rejoignez le tournoi « ${C.name} » sur Tournoi VBO. Code : ${code}`, url };
  if(navigator.share){
    try{ await navigator.share(data); return; }
    catch(e){ if(e&&e.name==='AbortError') return; } // l'utilisateur a annulé le partage
  }
  const ok=await copyText(`${data.text}\n${url}`); // repli : copie du message + lien
  toast(ok?'✓ Invitation copiée — collez-la aux capitaines':'Lien : '+url);
};

window.openPhaseSwitch=()=>{
  const cur=state.livePhase, nxt=nextPhase(cur);
  if(!nxt) return;
  const remaining=currentPhaseRemaining();
  if(remaining>0){ toast(`⚠️ ${remaining} match${remaining>1?'s':''} sans score — terminez « ${phaseName(cur)} » avant de la clôturer`); return; }
  const r=rulesFor(nxt); // défaut = copie des règles de brassage tant que non définies
  const hor=horaireFor(nxt); // horaire de la phase suivante (défaut = horaire du brassage)

    ? 'Les équipes qualifiées sont basculées dans les tableaux à élimination.'

    if(multi) adjustPoolsBlock = `<button class="btn warn" style="margin:0 0 14px" onclick="openPhase2PoolsEditor()">📋 Voir/Ajuster la répartition des poules</button>`;

    </div>

  updatePhaseSchedPreview();

window.updatePhaseSchedPreview=function(){
  const box=document.getElementById('nhPreview'); if(!box) return;
  const g=id=>document.getElementById(id);
  const st=(g('nh_start')&&g('nh_start').value)||'09:00';
  const rm=(+((g('nh_round')||{}).value))||20, su=(+((g('nh_setup')||{}).value))||0;
  const per=rm+su, parts=st.split(':'), base=((+parts[0])||9)*60+((+parts[1])||0);
  const fmt=t=>`${String(Math.floor(t/60)%24).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
  box.innerHTML=`Un tour toutes les ${per} min · Tour 1 à ${fmt(base)}, tour 2 à ${fmt(base+per)}, tour 3 à ${fmt(base+2*per)}…`;
};
// Permet à l'admin de corriger à la main la répartition automatique des qualifiés
// en poules de Principale/Consolante, avant de démarrer la phase (bouton dans la
// fiche « Fin de phase »). Un déplacement reste cantonné à sa catégorie d'origine.
window.openPhase2PoolsEditor=(fresh=true)=>{
  if(fresh){
    // Instantané pris à l'ouverture pour permettre un « Annuler » fiable : les
    // déplacements sont appliqués immédiatement en mémoire (movePhase2Team),
    // donc sans copie de départ on ne pourrait pas revenir en arrière.
    state._phase2EditSnapshot = JSON.parse(JSON.stringify({
      phasePrincipal: state.phasePrincipal,
      phaseConsolante: state.phaseConsolante,
      edited: state._phase2Edited
    }));
  }
  const catBlock=(key,label)=>{
    const cat=phaseData(key); if(!cat.pools || !cat.pools.length) return '';
    const allLetters=cat.pools.map(p=>p.letter);
    let h=`<p class="eyebrow" style="margin:14px 0 4px">${label}</p>`;
    cat.pools.forEach(p=>{
      h+=`<div class="pool"><div class="ph">Poule ${p.letter}</div><div style="padding:4px 10px 10px">`;
      p.teams.forEach(x=>{
        const lm=levelMeta(x.level); const esc=x.t.replace(/'/g,"\\'");
        h+=`<div class="p2card">
          <span class="seed">${ordinalFr(x.seed+1)}</span>
          <div class="p2info">
            <div class="p2name">${x.t}</div>
            <div class="p2meta">
              <span class="chip" style="color:${lm.color}">${lm.label}</span>
              <span class="chip">Vient de poule ${x.from||brassageOriginOf(x.t)||'?'}</span>
              ${x.wildcard?'<span class="chip" style="color:var(--brand)">🎖️ Meilleur 3e</span>':''}
            </div>
            <div class="p2moveto">
              <span class="p2movelbl">Déplacer vers</span>
              ${allLetters.filter(l=>l!==p.letter).map(l=>`<button class="p2pool" onclick="movePhase2Team('${key}','${p.letter}','${esc}','${l}')">Poule ${l}</button>`).join('')}
            </div>
          </div>
        </div>`;
      });
      h+=`</div></div>`;
    });
    return h;
  };
  openSheet(`
    <h3 class="sheet-title">Ajuster la répartition</h3>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.5">Chaque carte indique la poule et le classement de l'équipe à l'issue de la phase précédente. Touchez la lettre d'une poule pour y déplacer l'équipe.</p>
    ${catBlock('principal','🏅 Principale')}
    ${state.config.phaseConsolante ? catBlock('consolante','🥈 Consolante') : ''}
    <div class="btn-row" style="margin-top:16px">
      <button class="btn ghost" style="flex:1" onclick="cancelPhase2PoolsEdit()">Annuler</button>
      <button class="btn ok" style="flex:1" onclick="savePhase2PoolsEdit()">Enregistrer</button>
    </div>
  `);
};
window.movePhase2Team=(catKey,from,name,to)=>{
  if(from===to) return;
  const cat = catKey==='consolante' ? state.phaseConsolante : state.phasePrincipal;
  if(!cat || !cat.pools) return;
  const pf=cat.pools.find(p=>p.letter===from), pt=cat.pools.find(p=>p.letter===to);
  if(!pf||!pt) return;
  const idx=pf.teams.findIndex(x=>x.t===name); if(idx<0) return;
  const [tm]=pf.teams.splice(idx,1); pt.teams.push(tm);
  state._phase2Edited=true;
  cat.schedule = makeSchedule(cat.pools, horaireFor('poules2'));
  openPhase2PoolsEditor(false); toast(name+' → Poule '+to);
};
window.cancelPhase2PoolsEdit=()=>{
  const snap=state._phase2EditSnapshot;
  if(snap){
    state.phasePrincipal=snap.phasePrincipal;
    state.phaseConsolante=snap.phaseConsolante;
    state._phase2Edited=snap.edited;
  }
  state._phase2EditSnapshot=null;
  openPhaseSwitch(); toast('Modifications annulées');
};

window.swapFinalTeam=(catKey,mi,side,newTeam)=>{
  const prop=(state._finalesProposal||{})[catKey]; if(!prop) return;
  const oldTeam=prop.pairs[mi][side];
  if(oldTeam===newTeam) return;

  prop.pairs.forEach((pair,pi)=>{ pair.forEach((t,si)=>{ if(t===newTeam) found=[pi,si]; }); });

  prop.pairs[mi][side]=newTeam;
  prop.pairs[found[0]][found[1]]=oldTeam;

  openFinalesPairingEditor(false); toast('Appariement modifié');
};

window.confirmPhaseSwitch=async ()=>{
  const cur=state.livePhase, nxt=nextPhase(cur); if(!nxt) return;
  const g=id=>document.getElementById(id), base=rulesFor(nxt);
  const r={
    sets: g('n_sets')?+g('n_sets').value:base.sets,
    pointsPerSet: g('n_pts')?+g('n_pts').value:base.pointsPerSet,
    setMinutes: g('n_min')?+g('n_min').value:base.setMinutes,
    timed: g('sw_n_timed')?g('sw_n_timed').classList.contains('on'):base.timed,
    twoPointGap: g('sw_n_gap')?g('sw_n_gap').classList.contains('on'):base.twoPointGap,
  };
  setPhaseRules(nxt, r);
  const bh=horaireFor(nxt);
  setHoraire(nxt, {
    startTime: g('nh_start')?g('nh_start').value:bh.startTime,
    roundMinutes: g('nh_round')?+g('nh_round').value:bh.roundMinutes,
    setupMinutes: g('nh_setup')?+g('nh_setup').value:bh.setupMinutes,
  });

  // Si la phase 2 a déjà été persistée (ex: retour en arrière puis relance), on ne
  // recalcule ni ne ré-insère rien — on ne fait que ré-avancer le curseur de phase.
  let alreadyPersisted=false;
  if(nxt==='poules2'){
    if(g('sw_splitgym')) state.config.splitPhase2ByGym = g('sw_splitgym').classList.contains('on');
    alreadyPersisted = !!(state.phasePrincipal && state.phasePrincipal.schedule && state.phasePrincipal.schedule.length && state.phasePrincipal.schedule[0].id);
    if(!alreadyPersisted){
      if(!state._phase2Edited){ state.phasePrincipal=null; state.phaseConsolante=null; buildPhase2(); } // applique la répartition choisie
      else{
        // La répartition a été ajustée manuellement (movePhase2Team) avec l'horaire
        // actif à ce moment-là : on ne refait pas buildPhase2() (perdrait l'ajustement),
        // mais il faut tout de même régénérer les horaires du planning avec l'horaire
        // qui vient d'être choisi/confirmé ci-dessus (setHoraire), sans toucher aux poules.
        const hor2=horaireFor('poules2');
        if(state.phasePrincipal) state.phasePrincipal.schedule=makeSchedule(state.phasePrincipal.pools, hor2);
        if(state.config.phaseConsolante && state.phaseConsolante) state.phaseConsolante.schedule=makeSchedule(state.phaseConsolante.pools, hor2);
      }
    }
  }

  let alreadyPersistedFinales=false;

  }

  if(btn){ btn.disabled=true; btn.textContent='Enregistrement…'; }
  const t=state.tournaments.find(x=>x.id===state.currentDraftId);
  try{
    if(window.vboDb && t && vboDb.isUuid(t.id)){
      if(nxt==='poules2' && !alreadyPersisted){
        const structure=buildPhaseStructure('principal', state.phasePrincipal);
        if(state.config.phaseConsolante){
          const c=buildPhaseStructure('consolante', state.phaseConsolante);
          const names=new Set(structure.gyms.map(x=>x.name));
          c.gyms.forEach(x=>{ if(!names.has(x.name)){ structure.gyms.push(x); names.add(x.name); } });
          structure.pools.push(...c.pools);
          structure.matches.push(...c.matches);
        }
        await vboDb.addPhase(t.id, structure);
      }
      if(nxt==='finales' && !alreadyPersistedFinales){
        // Têtes de série du 1er tour, issues du classement réel de la phase précédente
        // — sauf si l'admin a lui-même échangé des équipes via openFinalesPairingEditor().
        const edited=state._finalesEdited && state._finalesProposal;
        const prinPairs = edited && state._finalesProposal.principal ? state._finalesProposal.principal.pairs : buildBracket(phaseData('principal')).first;
        const structure=buildBracketMatches('finalesPrincipal', 1, prinPairs);
        if(state.config.phaseConsolante){
          const consPairs = edited && state._finalesProposal.consolante ? state._finalesProposal.consolante.pairs : buildBracket(phaseData('consolante')).first;
          structure.matches.push(...buildBracketMatches('finalesConsolante', 1, consPairs).matches);
        }
        await vboDb.addPhase(t.id, structure);
      }
      t.livePhase=nxt;
      await vboDb.save(t, {});

    console.warn('Passage de phase:', e);

    if(btn){ btn.disabled=false; btn.textContent=`Démarrer « ${phaseName(nxt)} »`; }
    return;
  }

  state._phase2Edited=false; state._finalesEdited=false; state._finalesProposal=null;
  state.livePhase=nxt;
  if(t) t.livePhase=nxt;
  // Le Planning/Classements doivent basculer sur la nouvelle phase par défaut,
  // sinon ils continuent d'afficher les matchs de la phase qui vient d'être clôturée.
  schedPhase = nxt==='brassage' ? 'brassage' : 'principal'; schedGym='all';
  standPhase = nxt==='brassage' ? 'brassage' : 'principal'; standPool=null;
  timerReset();
  closeSheet();
  toast(PHASE_ICON[nxt]+' '+phaseName(nxt)+(nxt==='finales'?' lancées':' lancée'));
  render('orgLive');
};

/* ---------- Phases du tournoi (brassage → poules2 → finales) ---------- */

// Matchs de la phase EN COURS (pour vérifier qu'elle est bien terminée avant de clôturer).
function currentPhaseMatches(){
  if(state.livePhase==='brassage') return state.schedule||[];
  if(state.livePhase==='poules2'){
    ensurePhases();
    return [...(state.phasePrincipal.schedule||[]), ...(state.config.phaseConsolante?(state.phaseConsolante.schedule||[]):[])];
  }
  if(state.livePhase==='finales'){
    const sides=['principal', ...(state.config.phaseConsolante?['consolante']:[])];
    return sides.flatMap(k=> [...(bracketData(k).schedule||[]), ...(bracketData3e(k).schedule||[])]);
  }

}
function currentPhaseRemaining(){ return currentPhaseMatches().filter(m=>m.status!=='done').length; }
// Matchs du tour actif d'UN groupe (poule/catégorie), calculé GYMNASE PAR
// GYMNASE : avec plusieurs gymnases, chacun avance à son propre rythme (un
// tour peut être entamé dans l'un et pas encore dans l'autre), donc le tour
// actif de chaque gymnase est déterminé indépendamment — le plus ancien tour
// de CE gymnase pas encore entièrement terminé. Reflète qu'un tour entier se
// joue en même temps dès qu'il a commencé, sans dépendre d'un clic
// « Démarrer » match par match (cf. liveNowMatches, Accueil organisateur
// « Terrains en cours »).
function activeRoundMatches(sch){
  const gyms=[...new Set((sch||[]).map(m=>m.gym))];
  return gyms.flatMap(g=>{
    const gsch=sch.filter(m=>m.gym===g);
    const rounds=[...new Set(gsch.map(m=>m.r))].filter(r=>r!=null).sort((a,b)=>a-b);
    for(const r of rounds){
      const ms=gsch.filter(m=>m.r===r);
      if(!ms.every(m=>m.status==='done')) return ms.filter(m=>m.status!=='done');
    }
    return [];
  });
}
// Matchs « en cours » affichés à l'Accueil organisateur, calculés par
// catégorie (Principale/Consolante peuvent avoir des horaires/tours
// différents, donc chacune a son propre tour actif).
function liveNowMatches(){
  if(state.livePhase==='brassage') return activeRoundMatches(state.schedule||[]);
  if(state.livePhase==='poules2'){
    ensurePhases();
    return [
      ...activeRoundMatches(state.phasePrincipal.schedule||[]),
      ...(state.config.phaseConsolante?activeRoundMatches(state.phaseConsolante.schedule||[]):[]),
    ];
  }
  if(state.livePhase==='finales'){
    const sides=['principal', ...(state.config.phaseConsolante?['consolante']:[])];
    return sides.flatMap(k=> [...activeRoundMatches(bracketData(k).schedule||[]), ...activeRoundMatches(bracketData3e(k).schedule||[])]);
  }
  return [];
}

function paintTimer(){

/* Audio débloqué au premier geste utilisateur (lancement du tour), réutilisé pour la sonnerie. */
let _ac=null;
function ensureAudio(){ try{ if(!_ac) _ac=new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended') _ac.resume(); }catch(e){ return null; } return _ac; }
function timerBuzz(){
  const a=ensureAudio();
  if(a){ try{
    const now=a.currentTime;
    [0,.35,.70].forEach((t,i)=>{
      const o=a.createOscillator(), g=a.createGain();
      o.connect(g); g.connect(a.destination); o.type='square';
      o.frequency.value = i===2?1100:880;
      g.gain.setValueAtTime(.0001, now+t);
      g.gain.exponentialRampToValueAtTime(.3, now+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, now+t+.28);
      o.start(now+t); o.stop(now+t+.3);
    });
  }catch(e){} }
  try{ if(navigator.vibrate) navigator.vibrate([250,120,250,120,400]); }catch(e){}
}
/* Pré-alerte (30 s avant la fin) : signal plus doux et distinct de la sonnerie finale. */
function timerPreBuzz(){
  const a=ensureAudio();

    const now=a.currentTime;
    [0,.28].forEach((t)=>{
      const o=a.createOscillator(), g=a.createGain();
      o.connect(g); g.connect(a.destination); o.type='sine';
      o.frequency.value=560;

      g.gain.exponentialRampToValueAtTime(.0001, now+t+.2);

}

function releaseWake(){ try{ if(_wake){ _wake.release(); _wake=null; } }catch(e){} }
function timerTick(){
  // Temps restant calculé sur l'horloge réelle : fiable même après un gel (écran verrouillé / app en arrière-plan).
  if(timer.endAt){ timer.remaining = Math.max(0, Math.round((timer.endAt - Date.now())/1000)); }
  else { timer.remaining--; }
  if(timer.remaining<=0){ timer.remaining=0; timerStop(); timerBuzz(); }
  else if(timer.remaining<=PRE_ALERT && !timer.preAlertDone){ timer.preAlertDone=true; timerPreBuzz(); }
  paintTimer();
}
function timerStop(){ if(timer.id){ clearInterval(timer.id); timer.id=null; } timer.running=false; timer.endAt=null; releaseWake(); }
window.timerToggle=()=>{
  if(timer.remaining<=0 || timer.ended){ timer.remaining=(liveRules().setMinutes||15)*60; timer.ended=false; timer.preAlertDone=false; }
  if(timer.running){ timerStop(); }
  else {
    ensureAudio();                                    // débloque l'audio (geste utilisateur)
    timer.running=true; timer.started=true;
    timer.endAt = Date.now() + timer.remaining*1000;  // ancre horloge réelle
    timer.id=setInterval(timerTick,250);              // tick fin → resync rapide au réveil
    requestWake();                                    // garde l'écran allumé
    toast('Tour '+timer.round+' lancé');
  }
  paintTimer();
};
window.timerEndSet=()=>{ timerStop(); timer.ended=true; paintTimer(); toast('Set arrêté — 25 points atteints'); };
window.timerReset=()=>{ timerStop(); timer.ended=false; timer.started=false; timer.preAlertDone=false; timer.remaining=(liveRules().setMinutes||15)*60; paintTimer(); };
window.timerNext=()=>{ timerStop(); timer.ended=false; timer.preAlertDone=false; timer.round++; timer.remaining=(liveRules().setMinutes||15)*60; paintTimer(); toast('Tour '+timer.round+' prêt'); };
/* Au retour de l'app au premier plan : resync immédiat + reprise du wake lock (relâché pendant la mise en arrière-plan). */
document.addEventListener&&document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && timer.running){ requestWake(); timerTick(); }
});

/* ---------- Planning / matchs à venir (organisateur) ---------- */
let schedGym='all';
// État (dé)plié des tours du planning (clé = "phase:round" → true/false explicite).
// Par défaut, seul le 1er tour est déplié, les autres sont réduits.
let schedCollapsedState=new Map();
function isSchedRoundCollapsed(r){
  const k=schedPhase+':'+schedGym+':'+r;
  return schedCollapsedState.has(k) ? schedCollapsedState.get(k) : true;
}
window.toggleSchedRound=(r)=>{
  const k=schedPhase+':'+schedGym+':'+r;
  schedCollapsedState.set(k, !isSchedRoundCollapsed(r));
  // render() remet le scroll en haut (comportement voulu pour une vraie
  // navigation) ; ici on reste sur un simple repli/dépli, donc on restaure
  // la position de lecture au lieu de renvoyer en haut de l'écran.
  const y=host.scrollTop;
  render('schedule');
  host.scrollTop=y;
};
function schedBadge(s){
  return s==='done'?`<span class="badge ok" style="margin-left:auto">Terminé</span>`
    : s==='live'?`<span class="badge warn" style="margin-left:auto">● En cours</span>`
    : `<span class="badge wait" style="margin-left:auto">À venir</span>`;
}
function schedRow(m){
  const played=matchSetsPlayed(m);
  const sc = played.length ? scoreSC(m) : `<span class="vs">vs</span>`;
  // Saisie admin/référent : seuls les matchs persistés (phase de brassage,
  // avec un id réel renvoyé par le backend) peuvent recevoir un score ici.
  const canEnter = !!m.id;
  const btnLabel = m.status==='done' ? '✏️ Modifier le score' : played.length ? '📝 Continuer la saisie' : '📝 Saisir le score';
  // Un match "à venir" peut aussi être basculé en direct depuis ici, sans
  // attendre qu'une équipe le fasse elle-même sur le terrain (cf. startMatch
  // côté capitaine/arbitre, même effet côté API : started_at).
  const startBtn = (canEnter && m.status==='upcoming')
    ? `<button class="btn ghost sm" style="margin-top:8px;width:100%" onclick="adminStartMatch('${m.id}')">▶️ Démarrer ce match</button>` : '';
  return `<div class="match ${m.status==='done'?'done':m.status==='live'?'live':'upcoming'}">
    <div class="meta"><span class="chip" style="background:color-mix(in srgb, ${gymColor(m.gym)} 18%, var(--surface-2));color:${gymColor(m.gym)}">🏟️ ${m.gym}</span><span>Terrain ${m.court} · Poule ${m.pool}</span>${schedBadge(m.status)}</div>
    <div class="teams"><span class="t"><span>${m.a}</span>${levelBadge(m.a)}</span><span class="sc">${sc}</span><span class="t right"><span>${m.b}</span>${levelBadge(m.b)}</span></div>${refLine(m)}
    ${canEnter?`<button class="btn ghost sm" style="margin-top:8px;width:100%" onclick="openAdminScoreSheet('${m.id}')">${btnLabel}</button>`:''}
    ${startBtn}</div>`;
}
window.adminStartMatch=async (id)=>{
  try{
    if(window.vboDb) await vboDb.adminStartMatch(id);

// Règles (nb de sets) applicables à un match selon SA phase réelle, pas la phase en
// cours de l'écran — nécessaire pour la saisie (poules2/finales peuvent avoir plus de
// sets que le brassage).
function rulesForMatchPhase(phase){
  if(phase==='principal'||phase==='consolante') return rulesFor('poules2');
  if(phase==='finalesPrincipal'||phase==='finalesConsolante'||phase==='finalesPrincipal3e'||phase==='finalesConsolante3e') return rulesFor('finales');
  return rulesFor('brassage');
}
window.openAdminScoreSheet=(id)=>{
  const m=findMatchById(id); if(!m) return;
  const nSets=Math.max(1, rulesForMatchPhase(m.phase).sets||1);
  const preSets=(m.sets&&m.sets.length)?m.sets : (m.sa!=null?[[m.sa,m.sb]]:[]);
  const rows=Array.from({length:nSets},(_,s)=>{
    const sa=preSets[s]?preSets[s][0]:''; const sb=preSets[s]?preSets[s][1]:'';
    return `<div class="scorebox"${s>0?' style="margin-top:12px"':''}>
      ${nSets>1?`<div class="setlab">Set ${s+1}</div>`:''}
      <div><div class="tlab">${m.a}</div><input class="num" id="asc${s}" inputmode="numeric" value="${sa}" placeholder="0"></div>
      <div class="dash">–</div>
      <div><div class="tlab">${m.b}</div><input class="num" id="bsc${s}" inputmode="numeric" value="${sb}" placeholder="0"></div>
    </div>`;
  }).join('');
  // Les matchs de bracket n'ont ni poule ni vrai terrain : on affiche le nom du tour.
  const isThird = m.phase==='finalesPrincipal3e' || m.phase==='finalesConsolante3e';
  const isFinals = isThird || m.phase==='finalesPrincipal' || m.phase==='finalesConsolante';
  const subtitle = isFinals ? `${isThird?'🥉':'🏆'} ${bracketRoundLabel(m)}` : `Poule ${m.pool} · Terrain ${m.court} · ${m.gym}`;
  openSheet(`<h3 style="font-size:18px;margin:2px 0 4px;font-family:var(--font-display)">Saisir le score</h3>
    <p class="muted" style="font-size:13px;margin:0 0 14px">${subtitle}</p>
    ${rows}
    ${nSets>1?`<p class="muted" style="font-size:12px;margin:10px 0 0">💡 Vous pouvez valider un set à la fois : revenez sur ce match une fois le set suivant terminé.</p>`:''}
    <button class="btn" style="margin-top:16px;width:100%" id="admScoreBtn" onclick="submitAdminScore('${id}')">Valider le score</button>`);
};
window.submitAdminScore=async (id)=>{
  const mFor=findMatchById(id);
  const nSets=Math.max(1, rulesForMatchPhase(mFor&&mFor.phase).sets||1);
  const sets=[];
  let sawEmpty=false;
  for(let s=0;s<nSets;s++){
    const aVal=((document.getElementById('asc'+s)||{}).value||'').trim();
    const bVal=((document.getElementById('bsc'+s)||{}).value||'').trim();
    if(aVal===''&&bVal===''){ sawEmpty=true; continue; }
    // Saisie set par set : les sets doivent être remplis dans l'ordre, pas de trou.
    if(sawEmpty){ toast(`Set ${s} manquant avant le set ${s+1}`); return; }
    const a=parseInt(aVal), b=parseInt(bVal);
    if(isNaN(a)||isNaN(b)){ toast(`Entrez les deux scores du set ${s+1}`); return; }
    if(a===b){ toast(nSets>1?`Set ${s+1} : un set ne peut pas être à égalité`:'Un set ne peut pas finir à égalité'); return; }
    sets.push([a,b]);
  }
  if(!sets.length){ toast(nSets>1?'Entrez le score d\'au moins un set':'Entrez les deux scores'); return; }
  const complete=sets.length===nSets;
  const btn=document.getElementById('admScoreBtn');
  if(btn){ btn.disabled=true; btn.textContent='Enregistrement…'; }
  try{
    if(window.vboDb) await vboDb.setMatchScore(id, sets, complete);
    const m=findMatchById(id);
    if(m) Object.assign(m, {sa:sets[0][0], sb:sets[0][1], sets, status: complete?'done':'upcoming'});
    if(m && complete && (m.phase==='finalesPrincipal'||m.phase==='finalesConsolante')) await advanceBracketIfRoundDone(m.phase);
    closeSheet();
    toast(complete?'✓ Score enregistré':'✓ Set enregistré — revenez après le prochain set');
    const cur=navStack[navStack.length-1];
    // Simple rafraîchissement de l'écran (pas une vraie navigation) : on
    // restaure la position de lecture au lieu de renvoyer en haut de la page.
    if(cur){ const y=host.scrollTop; render(cur.screen, cur.opts); host.scrollTop=y; }
  }catch(e){
    console.warn('Saisie score:', e);
    toast('⚠️ Enregistrement échoué');
    if(btn){ btn.disabled=false; btn.textContent='Valider le score'; }
  }
};
let schedPhase='brassage';
window.setSchedPhase=k=>{ schedPhase=k; schedGym='all'; render('schedule'); };
screens.schedule = ()=>{
  setTop(null); renderTabs('schedule');
  const schedule=phaseData(schedPhase).schedule||[];
  const gyms=['all',...new Set(schedule.map(m=>m.gym))];
  const realGyms=gyms.filter(g=>g!=='all');
  const rounds=[...new Set(schedule.map(m=>m.r))].sort((a,b)=>a-b);
  const lbl=g=> g==='all'?'Tous':g;
  const nAvenir=schedule.filter(m=>m.status==='upcoming'&&(schedGym==='all'||m.gym===schedGym)).length;
  const phaseName = schedPhase==='brassage'?'Phase de brassage':`Phase 2 · ${PHASE_LABEL[schedPhase]}`;
  const vh = horaireFor(schedPhase==='brassage'?'brassage':'poules2');
  const vRound=(+vh.roundMinutes)||20, vSetup=vh.setupMinutes!=null?+vh.setupMinutes:10;
  const schedPhaseIcon={brassage:'🔄',principal:'🥇',consolante:'🥈'};
  const schedPhaseKeys=['brassage','principal',...(state.config.phaseConsolante?['consolante']:[])];
  // Petit point d'état sur chaque bouton de phase : vert si tous les matchs de
  // cette phase sont joués, orange si au moins un l'est (ou en cours), rien si
  // la phase n'a pas encore démarré — pour repérer l'avancement sans avoir à
  // cliquer sur chaque onglet.
  // Une phase est considérée terminée dès que l'admin est passé à la phase
  // suivante (state.livePhase), même si segDot ne regardait jusqu'ici que le
  // statut de chaque match individuellement — plus sûr pour signaler visuellement
  // qu'on ne reviendra plus sur cette phase.
  const orderKey=k=> k==='principal'||k==='consolante' ? 'poules2' : k;
  const segDot=k=>{
    const ms=(phaseData(k).schedule)||[];
    if(!ms.length) return '';
    const order=phaseOrder(), iK=order.indexOf(orderKey(k)), iCur=order.indexOf(state.livePhase);
    if((iK>=0&&iCur>=0&&iK<iCur) || ms.every(m=>m.status==='done')) return `<span class="segdot done" title="Terminé"></span>`;
    if(ms.some(m=>m.status==='done'||m.status==='live'||matchSetsPlayed(m).length>0)) return `<span class="segdot live" title="En cours"></span>`;
    return '';
  };
  let h=`<div style="padding:0">
    <h3 style="font-size:19px;margin-bottom:2px">Planning des matchs</h3>
    <p class="muted" style="margin:0 0 6px;font-size:13px">${phaseName} · ${nAvenir} match${nAvenir>1?'s':''} à venir</p>
    <p class="muted" style="margin:0 0 var(--pad-y);font-size:11.5px;line-height:1.4">🕐 Début ${vh.startTime||'09:00'} · un tour toutes les ${vRound+vSetup} min (${vRound} min de jeu + ${vSetup} min de mise en place)</p>
    <div class="filter-sticky">
    <p class="eyebrow" style="margin:0 0 6px">Phase</p>
    <div class="seg seg-strong">${schedPhaseKeys.map(k=>`<button class="${schedPhase===k?'on':''}" onclick="setSchedPhase('${k}')">${schedPhaseIcon[k]} ${PHASE_LABEL[k]}${segDot(k)}</button>`).join('')}</div>
    ${realGyms.length<=1 ? '' : `<p class="eyebrow" style="margin:14px 0 6px">🏟️ Gymnase</p>
    <div class="seg seg-strong">${gyms.map(g=>`<button class="${schedGym===g?'on':''}" onclick="schedGym='${g}';render('schedule')">${g!=='all'?`<span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${gymColor(g)};margin-right:5px;vertical-align:middle"></span>`:''}${lbl(g)}</button>`).join('')}</div>`}
    </div>
    ${realGyms.length<=1 ? `<p class="muted" style="margin:0 0 14px;font-size:13px">📍 Se joue à : <b style="color:${gymColor(realGyms[0])}">${realGyms[0]||'—'}</b></p>` : ''}`;
  rounds.forEach(r=>{
    const ms=schedule.filter(m=>m.r===r&&(schedGym==='all'||m.gym===schedGym));
    if(!ms.length) return;
    // "Tous" avec plusieurs gymnases : grouper par gymnase (terrains croissants dans
    // chaque groupe) plutôt que de tout mélanger. Un seul gymnase sélectionné : les
    // terrains sont simplement triés par ordre croissant.
    const grid = (schedGym==='all' && realGyms.length>1)
      ? realGyms.map(g=>{
          const gm=ms.filter(m=>m.gym===g).sort((a,b)=>(a.court||0)-(b.court||0));
          if(!gm.length) return '';
          return `<p class="eyebrow" style="margin:10px 0 4px;color:${gymColor(g)}">🏟️ ${g}</p><div class="sched-grid">${gm.map(schedRow).join('')}</div>`;
        }).join('')
      : `<div class="sched-grid">${[...ms].sort((a,b)=>(a.court||0)-(b.court||0)).map(schedRow).join('')}</div>`;
    const done=ms.every(m=>m.status==='done');
    // Un tour est "en cours" si un de ses matchs l'est réellement (démarré ou
    // déjà saisi côté capitaine) — PAS simplement parce que le tour précédent
    // est terminé : ça affichait "En cours" ici avant même qu'un seul match
    // du tour n'ait vraiment commencé, ce qui ne correspondait à rien côté
    // capitaine (son match restait "À venir" tant qu'il n'est pas démarré).
    const live=!done&&ms.some(m=>m.status==='live'||matchSetsPlayed(m).length>0);
    const col=done?'var(--ok)':live?'var(--warn)':'var(--brand)';
    const colSoft=done?'var(--ok-soft)':live?'var(--warn-soft)':'var(--brand-soft)';
    const collapsed=isSchedRoundCollapsed(r);
    // Badge de statut affiché seulement replié : déplié, les matchs du tour
    // (et le cadre coloré) montrent déjà l'état en détail.
    const roundBadge = collapsed ? `<span class="badge ${done?'ok':live?'warn':'wait'}">${done?'Terminé':live?'● En cours':'À venir'}</span>` : '';
    h+=`<div class="round${collapsed?'':' open'}" style="--round-col:${col};--round-bg:${colSoft}">
      <div class="gymhead" style="cursor:pointer" onclick="toggleSchedRound(${r})">
        <span class="dot" style="background:${col}"></span><h3>Tour ${r}</h3>${roundBadge}
        <span class="count" style="margin-left:auto;color:var(--muted);font-weight:600">${ms[0].time}</span>
        <span class="btn ghost sm" style="padding:4px 9px;margin-left:8px;font-size:12px;line-height:1" aria-label="${collapsed?'Déplier':'Réduire'} le tour ${r}">${collapsed?'▸':'▾'}</span></div>
      ${!collapsed?grid:''}</div>`;
  });
  h+=`</div>`;
  host.innerHTML=h;
};

let standPool=null;
function poolStandingRows(p, schedule){
  const win=state.config.winPts??3, loss=state.config.lossPts??0;
  const played=(schedule||[]).filter(m=>m.pool===p.letter && m.status==='done');
  const rows=p.teams.map(t=>{
    const ms=played.filter(m=>m.a===t.t||m.b===t.t);
    let j=0, g=0, pf=0, pc=0;
    ms.forEach(m=>{
      const isA=m.a===t.t;
      const sets=(m.sets&&m.sets.length)?m.sets : (m.sa!=null?[[m.sa,m.sb]]:null);
      if(!sets) return;
      j++;
      sets.forEach(([a,b])=>{ pf+=isA?a:b; pc+=isA?b:a; });
      if(wonBy(m,t.t)) g++;
    });
    return {t:t.t, j, g, p:j-g, pts:g*win+(j-g)*loss, pf, pc};
  });
  rows.sort((a,b)=> b.pts-a.pts || (b.pf-b.pc)-(a.pf-a.pc) || a.t.localeCompare(b.t));
  return rows;
}
let standPhase='brassage';
const PHASE_LABEL={brassage:'Brassage',principal:'Principale',consolante:'Consolante'};
function phaseSeg(current,fn){

}
window.setStandPhase=k=>{ standPhase=k; standPool=null; render('standings'); };

    </div>

    ${rows.map((r,i)=>{const d=r.pf-r.pc;const dc=d>0?'var(--ok)':d<0?'var(--danger)':'var(--muted)';return `<tr class="${i<2?'qual':''}"><td><span class="rk ${i<2?'top':''}">${i+1}</span><span class="tcell"><span>${r.t}</span>${levelBadge(r.t)}</span></td><td>${r.j}</td><td style="color:var(--ok);font-weight:800">${r.g}</td><td>${r.pf}</td><td>${r.pc}</td><td style="color:${dc};font-weight:800">${d>0?'+':''}${d}</td><td><b>${r.pts}</b></td></tr>`;}).join('')}
    </tbody></table></div></div>
    <p class="muted" style="font-size:12px;margin-top:10px;line-height:1.6"><b>V</b> victoires · <b>PP</b> points pour · <b>PC</b> points contre · <b>Diff</b> différence · <b>Pts</b> points de classement (${state.config.winPts??3} par victoire, ${state.config.lossPts??0} par défaite).</p>
    <p class="muted" style="font-size:12.5px;margin-top:6px">${qualNote}</p>
  </div>`;

screens.validate = ()=>{
  setTop(null); renderTabs('validate');
  if(!state._conflictsLoaded && state.currentDraftId){
    refreshConflicts(state.currentDraftId);
    host.innerHTML=`<div style="padding:0"><div class="empty">⏳<p>Chargement…</p></div></div>`;
    return;
  }
  const all=state.conflicts;
  if(!all.length){ host.innerHTML=`<div style="padding:0;text-align:center;margin-top:40px"><div style="font-size:46px">✅</div><h3 style="margin-top:10px">Aucun conflit</h3><p class="lead">Tous les scores concordent.</p></div>`; return; }
  const conflicts=all.filter(c=>c.type!=='waiting');
  const waiting=all.filter(c=>c.type==='waiting');
  const cardFor=(c)=>{
    const oneSide = c.entryA ? 'a' : 'b';
    const oneEntry = c.entryA || c.entryB;
    const oneName = c.entryA ? c.a : c.b;
    const buttons = c.type==='waiting'
      ? `<button class="btn outline" style="flex-direction:column;gap:2px" onclick="resolveConflict('${c.matchId}','${oneSide}')">
          <small style="font-weight:600">Valider ${oneName}</small><span style="font-size:20px;font-weight:800">${scoreSC({sets:oneEntry.sets})}</span></button>`
      : `<button class="btn outline" style="flex-direction:column;gap:2px" onclick="resolveConflict('${c.matchId}','a')">
          <small style="font-weight:600">Capitaine ${c.a}</small><span style="font-size:20px;font-weight:800">${scoreSC({sets:c.entryA.sets})}</span></button>
        <button class="btn outline" style="flex-direction:column;gap:2px" onclick="resolveConflict('${c.matchId}','b')">
          <small style="font-weight:600">Capitaine ${c.b}</small><span style="font-size:20px;font-weight:800">${scoreSC({sets:c.entryB.sets})}</span></button>`;
    return `<div class="card" style="margin-top:12px">

async function applyConflictResolution(matchId){
  const i=state.conflicts.findIndex(c=>c.matchId===matchId); if(i>-1) state.conflicts.splice(i,1);
  if(state.currentDraftId && window.vboDb && vboDb.isUuid(state.currentDraftId)){
    try{ applyLoadedStructure(await vboDb.loadStructure(state.currentDraftId)); }catch(e){ console.warn('Relecture structure:', e); }
  }
  toast('Score validé — classement mis à jour');
  renderTabs('validate'); screens.validate();
}
window.resolveConflict=async (matchId,pick)=>{
  try{ await vboDb.resolveConflict(matchId, {pick}); await applyConflictResolution(matchId); }
  catch(e){ console.warn('Résolution conflit:', e); toast('⚠️ Validation échouée'); }
};
window.openResolveManual=(matchId)=>{
  const c=state.conflicts.find(x=>x.matchId===matchId); if(!c) return;
  const m=findMatchById(matchId);
  const nSets=Math.max(1, rulesForMatchPhase(m&&m.phase).sets||1);
  const rows=Array.from({length:nSets},(_,s)=>`<div class="scorebox"${s>0?' style="margin-top:12px"':''}>
      ${nSets>1?`<div class="setlab">Set ${s+1}</div>`:''}
      <div><div class="tlab">${c.a}</div><input class="num" id="rsc_a${s}" inputmode="numeric" placeholder="0"></div>
      <div class="dash">–</div>
      <div><div class="tlab">${c.b}</div><input class="num" id="rsc_b${s}" inputmode="numeric" placeholder="0"></div>
    </div>`).join('');
  openSheet(`<h3 style="font-size:18px;margin:2px 0 4px;font-family:var(--font-display)">Saisir un autre score</h3>
    <p class="muted" style="font-size:13px;margin:0 0 14px">Poule ${c.pool} · Terrain ${c.court}</p>
    ${rows}
    <button class="btn" style="margin-top:16px;width:100%" id="resolveManualBtn" onclick="submitResolveManual('${matchId}')">Valider le score</button>`);
};
window.submitResolveManual=async (matchId)=>{
  const m=findMatchById(matchId);
  const nSets=Math.max(1, rulesForMatchPhase(m&&m.phase).sets||1);
  const sets=[];
  for(let s=0;s<nSets;s++){
    const aVal=((document.getElementById('rsc_a'+s)||{}).value||'').trim();
    const bVal=((document.getElementById('rsc_b'+s)||{}).value||'').trim();
    if(aVal===''&&bVal==='') continue;
    const a=parseInt(aVal), b=parseInt(bVal);
    if(isNaN(a)||isNaN(b)){ toast(`Entrez les deux scores du set ${s+1}`); return; }
    if(a===b){ toast('Un set ne peut pas finir à égalité'); return; }
    sets.push([a,b]);
  }
  if(!sets.length){ toast('Entrez au moins le score d\'un set'); return; }
  const btn=document.getElementById('resolveManualBtn');
  if(btn){ btn.disabled=true; btn.textContent='Enregistrement…'; }
  try{
    await vboDb.resolveConflict(matchId, {sets});
    closeSheet();
    await applyConflictResolution(matchId);
  }catch(e){
    console.warn('Résolution manuelle:', e);
    toast('⚠️ Enregistrement échoué');
    if(btn){ btn.disabled=false; btn.textContent='Valider le score'; }
  }
};

let bracketCat='principal';
window.setBracketCat=k=>{ bracketCat=k; render('bracket'); };
// Classement 1er/2e/3e d'une catégorie : vainqueur/perdant de la finale + vainqueur de la
// petite finale. Tant que ces matchs ne sont pas (tous) joués, projection basée sur les
// têtes de série (`real:false`) — même esprit que l'aperçu du tableau avant lancement.
function podiumInfo(catKey){
  const cat=phaseData(catKey);
  const br=buildBracket(cat);
  const names=roundNames(br.K);
  const hasThird=br.K>=4;
  const sched=bracketData(catKey).schedule||[];
  const finalMatch=sched.find(m=>m.r===names.length);
  const finalDone=finalMatch && finalMatch.status==='done';
  const thirdMatch=hasThird ? (bracketData3e(catKey).schedule||[])[0] : null;
  const thirdDone=thirdMatch && thirdMatch.status==='done';
  let first=null, second=null, third=null;
  if(finalDone){ const w=matchWinner(finalMatch); first=w==='a'?finalMatch.a:finalMatch.b; second=w==='a'?finalMatch.b:finalMatch.a; }
  if(thirdDone){ const w=matchWinner(thirdMatch); third=w==='a'?thirdMatch.a:thirdMatch.b; }
  return {first, second, third, hasThird, real: finalDone && (!hasThird||thirdDone)};
}
screens.bracket = ()=>{
  setTop(null); renderTabs('bracket');
  if(bracketCat==='consolante' && !state.config.phaseConsolante) bracketCat='principal';
  const cat=phaseData(bracketCat);
  const catLabel=PHASE_LABEL[bracketCat];
  const br=buildBracket(cat);
  // Si l'admin a ajusté manuellement les face-à-face du 1er tour (fiche « Fin de
  // phase »), l'aperçu doit refléter cet ajustement et non le seedage automatique.
  ensureFinalesProposal();
  const finalesProp=(state._finalesProposal||{})[bracketCat];
  if(finalesProp && finalesProp.K===br.K) br.first=finalesProp.pairs.map(p=>p.slice());
  const names=roundNames(br.K);
  const hasThird=br.K>=4;
  const F=rulesFor('finales');
  const nSets=F.sets||1;
  const fmtNote=fmtRules(F);
  const rm=inner=>`<div class="rmatch">${inner}</div>`;
  // Une fois le bracket lancé, ses VRAIS matchs (avec id, pour la saisie de score) sont
  // dans bracketData() — tant qu'un tour n'y figure pas encore, on retombe sur l'aperçu
  // spéculatif (projection depuis le classement, pas de saisie possible).
  const persisted=bracketData(bracketCat).schedule||[];
  const byRound=r=>persisted.filter(m=>m.r===r).sort((a,b)=>(a.court||0)-(b.court||0));
  const started=persisted.length>0;
  const catSeg=`<div class="filter-sticky"><div class="seg seg-strong">
    <button class="${bracketCat==='principal'?'on':''}" onclick="setBracketCat('principal')">Principale</button>
    ${state.config.phaseConsolante?`<button class="${bracketCat==='consolante'?'on':''}" onclick="setBracketCat('consolante')">Consolante</button>`:''}
  </div></div>`;

  // Podium : sur la même page que le tableau (pas un onglet/vue séparée).
  const p=podiumInfo(bracketCat);
  const medal=(name,rankLabel,cls,icon)=> name?`<div class="pcard ${cls}"><span class="medal">${icon}</span><b class="pname">${name}</b><span class="prank">${rankLabel}</span></div>`:'';
  const podiumBlock = (p.first||p.second||p.third) ? `
    <p class="eyebrow" style="margin:16px 0 8px">🏆 Podium</p>
    <div class="podium">
      ${medal(p.second,'2e','p2','🥈')}
      ${medal(p.first,'1er','p1','🥇')}
      ${hasThird?medal(p.third,'3e','p3','🥉'):''}
    </div>
    <p class="muted" style="text-align:center;font-size:12px;margin:2px 0 4px">${p.real?'✅ Podium final — tous les résultats sont joués.':'Le podium se complète au fil des matchs décisifs joués.'}</p>` : '';

  let cols='';
  for(let ci=0; ci<names.length; ci++){
    const round=ci+1, real=byRound(round), nMatches=br.first.length/Math.pow(2,ci);
    // Tant qu'un tour n'est pas entièrement généré (ex: une seule des 2 demies est déjà
    // jouable), il faut quand même réserver UNE case par match attendu — sinon le ou les
    // matchs déjà réels se retrouvent seuls dans la colonne et ne s'alignent plus avec
    // les 2 matchs du tour précédent dont ils dépendent (cf court = position dans le tour).
    let inner;
    if(round===1) inner=br.first.map(([a,b],i)=>{
      const m=real.find(x=>(x.court||i+1)===i+1);
      return rm(m ? bm(m.a,m.b,m) : bm(a||'À déterminer', b||'À déterminer'));
    }).join(''); // aperçu avant lancement
    else inner=Array.from({length:nMatches}, (_,i)=>{
      const m=real.find(x=>(x.court||i+1)===i+1);
      return rm(m ? bm(m.a,m.b,m) : bm('À déterminer','À déterminer'));
    }).join('');
    cols+=`<div class="round"><h4>${names[ci]}</h4><div class="rmatches">${inner}</div></div>`;
  }
  const rw=164+nSets*20;
  // Petite finale (3e place) : même habillage colonne que le tableau (.round/h4/.rmatch),
  // mais dans son propre conteneur .bracket pour qu'elle reste seule :last-child et
  // n'hérite pas des connecteurs visuels entre tours (qui supposent une colonne suivante).
  let thirdCol='';
  if(hasThird){
    const m3=(bracketData3e(bracketCat).schedule||[])[0];
    const inner=rm(m3 ? bm(m3.a, m3.b, m3) : bm('À déterminer','À déterminer'));
    thirdCol=`<div class="bracket" style="--rw:${rw}px;margin-top:4px">
      <div class="round"><h4>🥉 Petite finale</h4><div class="rmatches">${inner}</div></div>
    </div>`;
  }
  host.innerHTML=`<div style="padding:0">
    <h3 style="font-size:19px;margin-bottom:4px">Phase finale · ${catLabel}</h3>
    <p class="lead" style="margin-top:0">${br.K} équipes qualifiées · départ en ${names[0]==='Finale'?'finale directe':names[0]+' de finale'}.</p>
    <p class="muted" style="margin:-4px 0 var(--pad-y);font-size:12px">🏆 Règles des finales : <b>${fmtNote}</b></p>
    ${catSeg}
    ${podiumBlock}
    <p class="eyebrow" style="margin:16px 0 8px">📋 Tableau</p>
    <div class="bracket" style="--rw:${rw}px">${cols}</div>
    ${thirdCol}
    <div class="card" style="margin-top:16px;text-align:center;background:var(--surface-2);border:none">
      <small class="muted">${started?'Appuyez sur un match pour saisir son score. Le tour suivant se génère automatiquement une fois le tour en cours terminé.':'Aperçu basé sur le classement actuel — les matchs seront créés au lancement des phases finales.'}</small>
    </div>
  </div>`;
};
function bm(a, b, m){
  const row=(name,val,win)=>`<div class="r${win?' win':''}"><span class="nm"><span class="nmtxt">${name}</span>${levelBadge(name)}</span><span class="sc"><b>${val}</b></span></div>`;
  if(!m || !m.id) return `<div class="bm">${row(a,'–')}${row(b,'–')}</div>`;
  const played=matchSetsPlayed(m);
  const last=played.length?played[played.length-1]:null;
  const w=matchWinner(m);
  const icon=m.status==='done' ? '✏️' : '📝';
  return `<div class="bm tap" onclick="openAdminScoreSheet('${m.id}')">
    ${row(a, last?last[0]:'–', w==='a')}${row(b, last?last[1]:'–', w==='b')}
    <span class="bmEdit">${icon}</span>
  </div>`;
}

window.submitReferent=async ()=>{
  const first=(document.getElementById('rf_first').value||'').trim();
  const last=(document.getElementById('rf_last').value||'').trim();
  const email=(document.getElementById('rf_mail').value||'').trim();
  const pass=(document.getElementById('rf_pass').value||'').trim();
  const name=[first,last].filter(Boolean).join(' ').trim();
  if(!name){ toast('Indiquez le prénom et le nom'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Adresse e-mail invalide'); return; }
  if(pass.length<8){ toast('Mot de passe : 8 caractères minimum'); return; }
  if(state.referents.some(x=>x.email.toLowerCase()===email.toLowerCase())){ toast('Un référent utilise déjà cet e-mail'); return; }
  const btn=document.getElementById('rf_submit');
  // Le référent de base : on affiche TOUJOURS le message récapitulatif ensuite,

  const r={id:'r'+Date.now(), name, email, password:pass, createdAt:Date.now(), status:'active', demo:false, accountOk:false, accountError:''};
  // On tente de créer le compte via l'API, sans jamais bloquer l'affichage du
  // message récapitulatif (qui reste copiable même en cas d'échec serveur).
  if(btn){ btn.disabled=true; btn.textContent='Création en cours…'; }
  try{

    if(data && data.ok){
      r.id = data.id||r.id; r.accountOk=true; state.referents.push(r); state._refsLoaded=false;

// --- Scan QR réel (caméra + jsQR), avec repli sur le code manuel ---------
let _scanStream=null;
function stopCamScan(){
  if(_scanStream){ try{ _scanStream.getTracks().forEach(t=>t.stop()); }catch(_){} _scanStream=null; }
}
function extractJoinCode(text){
  try{
    const m=(text||'').match(/join=([A-Za-z0-9-]+)/);
    if(m&&m[1]) return decodeURIComponent(m[1]).toUpperCase();
  }catch(_){}
  const t=(text||'').trim().toUpperCase();
  return /^[A-Z0-9-]{4,12}$/.test(t) ? t : null;
}
function handleScannedText(text){
  const code=extractJoinCode(text);
  if(!code){ toast('QR code non reconnu'); startCamScan(); return; }
  loadJoinedTournament(code);
  go('pickTeam');
}
async function startCamScan(){
  const video=document.getElementById('scanVideo');
  const canvas=document.getElementById('scanCanvas');
  const statusEl=document.getElementById('scanStatus');
  if(!video) return; // écran déjà quitté
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof jsQR!=='function'){
    if(statusEl) statusEl.textContent="Scan caméra indisponible sur cet appareil — utilisez le code ci-dessous.";
    return;
  }
  try{ _scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ if(statusEl) statusEl.textContent="Accès à la caméra refusé — utilisez le code ci-dessous."; return; }
  if(!document.body.contains(video)){ stopCamScan(); return; } // écran quitté pendant la demande de permission
  video.srcObject=_scanStream;
  try{ await video.play(); }catch(_){}
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  function tick(){
    if(!document.body.contains(video)){ stopCamScan(); return; } // écran quitté
    if(video.readyState===video.HAVE_ENOUGH_DATA && video.videoWidth){
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      const img=ctx.getImageData(0,0,canvas.width,canvas.height);
      const res=jsQR(img.data,img.width,img.height);
      if(res && res.data){ stopCamScan(); handleScannedText(res.data); return; }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// Rafraîchissement automatique en tâche de fond (capitaines ET organisation/
// référents) : sans ça, un score validé/démarré par quelqu'un d'autre ne
// remonte à l'écran que si on recharge la page. Ce routeur n'a pas de hook
// de démontage d'écran, donc on vérifie à chaque tick l'écran réellement
// affiché plutôt que d'armer/désarmer l'intervalle à la navigation.
let _liveRefreshBusy=false;
async function liveRefreshTick(){
  if(_liveRefreshBusy) return;
  const cur=navStack[navStack.length-1];
  if(!cur) return;
  _liveRefreshBusy=true;
  try{
    if(state.captainTeam && state.joinCode && (cur.screen==='myMatches'||cur.screen==='pickTeam')){
      await loadJoinedTournament(state.joinCode, state.captainTeam);
      return;
    }
    const tid=state.currentDraftId;
    if(window.vboDb && vboDb.isUuid(tid) && (cur.screen==='orgLive'||cur.screen==='schedule'||cur.screen==='validate')){
      const fresh = await vboDb.loadStructure(tid);
      applyLoadedStructure(fresh);
      // refreshConflicts se rend déjà lui-même pour 'orgLive'/'validate' (avec les
      // données déjà à jour ci-dessus) ; seul 'schedule' a besoin d'un rendu manuel.
      await refreshConflicts(tid);
      const cur2=navStack[navStack.length-1];
      if(cur2 && cur2.screen==='schedule' && cur.screen==='schedule' && screens.schedule){
        const y=host.scrollTop;
        screens.schedule(cur2.opts||{});
        host.scrollTop=y;
      }
    }
  }catch(e){ console.warn('Rafraîchissement auto:', e); }
  finally{ _liveRefreshBusy=false; }
}

// La saisie du score n'est possible que sur un match réellement en cours
// ('live'/'pending' : démarré par l'arbitre, ou déjà saisi par ce capitaine).
// Un match 'todo' ne peut être QUE démarré — jamais noté — pour éviter
// qu'un score soit enregistré avant que le match ait vraiment eu lieu.
function matchCard(m,team,hi){
  let badge='', action='';
  if(m.status==='valid'){ badge=`<span class="badge ok" style="margin-left:auto">✓ Validé</span>`; }
  else if(m.status==='pending'){ badge=`<span class="badge wait" style="margin-left:auto">⏳ En attente de l'adversaire</span>`; }
  else if(m.status==='live'){ badge=`<span class="badge warn" style="margin-left:auto">● En cours</span>`; }
  else { badge=`<span class="badge brand" style="margin-left:auto">⏭️ À venir</span>`; }
  const scObj = m.status==='valid' ? {sa:m.sa, sb:m.sb, sets:m.sets}
    : (m.mine ? {sa:m.mine.sa, sb:m.mine.sb, sets:m.mine.sets} : {sa:null, sb:null});
  action = m.status==='pending'
    ? `<button class="btn ghost sm" style="width:100%" onclick="go('enterScore',{id:'${m.id}'})">Modifier ma saisie</button>`
    : m.status==='live'
    ? `<button class="btn sm" style="width:100%" onclick="go('enterScore',{id:'${m.id}'})">Saisir le score en direct</button>`
    : m.status==='todo'
    ? `<button class="btn ghost sm" style="width:100%" onclick="startMatch('${m.id}')">▶️ Démarrer le match</button>`
    : '';
  return `<div class="match"${hi?' style="border:2px solid var(--brand)"':''}>
    <div class="meta"><span class="chip"${hi?' style="background:var(--brand-soft);color:var(--brand)"':''}>Tour ${m.round} · ${m.time}</span><span>T${m.court} · ${m.gym}</span>${badge}</div>
    <div class="teams"><span class="t">${m.a}</span>
      <span class="sc">${scoreSC(scObj)}</span>
      <span class="t right">${m.b}</span></div>
    ${refLine(m)}
    ${action}</div>`;
}
function refMatchCard(m){
  const st = m.status==='live'
    ? `<span class="badge warn" style="margin-left:auto">● En cours</span>`
    : `<span class="badge brand" style="margin-left:auto">À arbitrer</span>`;
  const action = m.status==='todo'
    ? `<button class="btn ghost sm" style="width:100%;margin-top:8px" onclick="startMatch('${m.id}')">▶️ Démarrer ce match</button>` : '';
  return `<div class="match">
    <div class="meta"><span class="chip">Tour ${m.round} · ${m.time}</span><span>T${m.court} · ${m.gym}</span>${st}</div>
    <div class="teams"><span class="t">${m.a}</span>

      <span class="t right">${m.b}</span></div>

    ${action}
  </div>`;
}

    <div style="margin-top:20px">${rows}</div>
    <button class="btn" style="margin-top:16px" id="submitScoreBtn" onclick="submitScore('${m.id}')">Valider mon score</button>
    <p class="demo-note" style="margin-top:16px">💡 Saisissez le score tel qu'il s'est joué. Le match est validé dès que l'autre capitaine a saisi le même score ; en cas d'écart, l'organisation tranche.</p>
  </div>`;
};
window.submitScore=async (id)=>{
  const nSets=Math.max(1, state.config.sets||1);
  const sets=[];
  for(let s=0;s<nSets;s++){
    const a=parseInt((document.getElementById('sa'+s)||{}).value);
    const b=parseInt((document.getElementById('sb'+s)||{}).value);
    if(isNaN(a)||isNaN(b)){ toast(nSets>1?'Entrez les scores de chaque set':'Entrez les deux scores'); return; }
    if(a===b){ toast(nSets>1?`Set ${s+1} : un set ne peut pas être à égalité`:'Un set ne peut pas finir à égalité'); return; }
    sets.push([a,b]);
  }
  const m=(state.captainList||[]).find(x=>x.id===id); if(!m){ go('myMatches',{replace:true}); return; }
  const se=(state.schedule||[]).find(x=>x.id===id);
  if(!se){ toast('⚠️ Match non synchronisé — revenez à la liste'); return; }
  const btn=document.getElementById('submitScoreBtn');
  if(btn){ btn.disabled=true; btn.textContent='Enregistrement…'; }
  try{
    const res=await api.submitCaptainScore(se.id, state.captainTeam||m.a, sets);
    if(res && res.status==='validated'){
      Object.assign(se, {sa:res.sa, sb:res.sb, sets:res.sets, status:'done'});
      toast('✓ Scores identiques — match validé automatiquement !');
    }else{
      state.myEntries = state.myEntries||{};
      state.myEntries[se.id] = {sa:sets[0][0], sb:sets[0][1], sets};
      toast('Score enregistré — en attente de l\'autre capitaine');
    }
    go('myMatches',{replace:true});
  }catch(e){
    console.warn('Saisie score capitaine:', e);
    toast('⚠️ Enregistrement échoué — réessayez');
    if(btn){ btn.disabled=false; btn.textContent='Valider mon score'; }
  }
};

/* ---------- Invitation référent : définir son mot de passe ---------- */
screens.setPassword = ()=>{
  setTop(null); tabbar.hidden=true;
  const recovery = state.inviteFlow==='recovery';
  host.innerHTML=`<div class="card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <span style="width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:18px">${ICON.referee}</span>
      <h3 style="font-size:18px;margin:0">${recovery?'Nouveau mot de passe':'Bienvenue&nbsp;!'}</h3>
    </div>
    <p class="lead">${recovery?'Choisissez un nouveau mot de passe pour votre compte.':'Vous rejoignez les référents du Volley-Ball Ollioulais. Choisissez votre mot de passe pour activer votre accès.'}</p>
    ${pwdField('Mot de passe','sp_pass','')}
    ${pwdField('Confirmez le mot de passe','sp_pass2','')}
    <div class="card" style="background:var(--surface-2);border:none;margin:10px 0 0"><small class="muted">🔒 Au moins 6 caractères. Vous l'utiliserez ensuite avec votre e-mail pour vous connecter.</small></div>
    <button class="btn" id="sp_submit" style="margin-top:16px" onclick="submitNewPassword()">Enregistrer et continuer</button>
  </div>`;
};
window.submitNewPassword=async ()=>{
  const p1=(document.getElementById('sp_pass').value||'').trim();
  const p2=(document.getElementById('sp_pass2').value||'').trim();
  if(p1.length<6){ toast('Mot de passe trop court (6 caractères min.)'); return; }
  if(p1!==p2){ toast('Les mots de passe ne correspondent pas'); return; }
  const btn=document.getElementById('sp_submit');
  if(btn){ btn.disabled=true; btn.textContent='Enregistrement…'; }
  try{
    await api.changePassword(p1);
    try{ history.replaceState(null,'',location.pathname); }catch(_){}
    state.inviteFlow=null;
    toast('Mot de passe enregistré ✓');
    go(state.refSession ? 'refSpace' : 'home');
  }catch(e){
    console.error(e);
    toast(e.status===401 ? 'Connexion requise — reconnectez-vous' : (e.message||'Échec — réessayez'));
    if(btn){ btn.disabled=false; btn.textContent='Enregistrer et continuer'; }
  }
};

/* ---------- Render dispatch ---------- */
// Écrans « formulaire » à une colonne : restent resserrés/centrés en desktop (.screen.narrow)
// au lieu de s'étirer sur toute la largeur du conteneur élargi.
const NARROW_SCREENS=new Set(['home','login','refLogin','createRef','setPassword','wizard','enterScore','scan','qr','teamsRegister','assignPools','summary','refProfile','refMail']);
function render(screen,opts){
  (screens[screen]||screens.home)(opts||{});
  orgHeader.hidden = tabbar.hidden;
  host.classList.toggle('narrow', NARROW_SCREENS.has(screen));
  // Retour tout en haut à chaque changement d'écran (y compris les .screen imbriqués).
  host.scrollTop=0;
  host.querySelectorAll('.screen').forEach(el=>{ el.scrollTop=0; });
  try{ window.scrollTo(0,0); }catch(_){}
}
(async function boot(){
  const code=readJoinCodeFromUrl();
  if(code){
    // L'URL de QR/invitation garde son ?join=... après navigation : sans ça,
    // un capitaine qui a déjà choisi son équipe revient à la liste des équipes
    // à chaque F5 au lieu de rester sur « Mes matchs ».
    let saved=null;
    try{ saved=JSON.parse(localStorage.getItem('vbo_captain')||'null'); }catch(_){}
    if(saved && saved.code===code && saved.team){
      state.captainTeam=saved.team;
      await loadJoinedTournament(code, saved.team);
      if(!localStorage.getItem('vbo_captain')) return; // code expiré : déjà redirigé vers l'écran de scan
      go('myMatches'); return;
    }
    loadJoinedTournament(code); go('pickTeam'); return;
  }
  // Restaure la session serveur (cookie PHP) si elle est encore valide,
  // pour éviter de renvoyer sur « Qui êtes-vous ? » à chaque refresh.
  if(window.api){
    try{
      const res = await api.me();
      const u = res && res.user;
      if(u && u.role==='admin'){
        state.authed=true; state.adminProfile={ id:u.id, name:u.name, email:u.email };
        if(await restoreLastRoute('vbo_route_admin')) return;
        go('dashboard'); return;
      }
      if(u && u.role==='referent'){
        state.refProfile={ id:u.id, name:u.name, email:u.email };
        state.refSession='ovh';
        if(await restoreLastRoute('vbo_route_ref')) return;
        await refreshTournaments();
        go('refSpace'); return;
      }
    }catch(e){ console.warn('Restauration session:', e); }
  }
  // Les capitaines n'ont pas de session serveur : on restaure leur équipe
  // via localStorage pour éviter un retour à « Qui êtes-vous ? » au refresh.
  try{
    const saved = JSON.parse(localStorage.getItem('vbo_captain')||'null');
    if(saved && saved.code && saved.team){
      state.captainTeam = saved.team;
      await loadJoinedTournament(saved.code, saved.team);
      // En cas de code expiré/invalide, loadJoinedTournament a déjà navigué
      // vers l'écran de scan et vidé vbo_captain — ne pas écraser ça.
      if(!localStorage.getItem('vbo_captain')) return;
      go('myMatches'); return;
    }
  }catch(e){ console.warn('Restauration capitaine:', e); }
  go('home');
})();
</script>
