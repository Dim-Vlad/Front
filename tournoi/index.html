<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gestion des tournois du Volley-Ball Ollioulais — des poules au classement final, depuis le gymnase.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2e8b57">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tournoi VBO">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<title>Tournoi VBO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
// Thème choisi à la main (clair/sombre) : appliqué avant le CSS pour éviter
// le flash ; sans préférence enregistrée, on suit le thème du système (CSS).
try{
  var _t=localStorage.getItem('vbo_theme');
  if(_t==='light'||_t==='dark') document.documentElement.setAttribute('data-theme',_t);
}catch(e){}
</script>
<style>
/* Layout concept: single mobile app frame (max 440px), screen router, sticky bottom tab bar + contextual top bar */
:root{
  /* Palette Volley-Ball Ollioulais — verts club, thème clair style iOS */
  --ink:#0a2410;        /* vert forêt profond */
  --bg:#f2f6f0;         /* fond groupé clair, légère teinte verte (iOS) */
  --surface:#ffffff;
  --surface-2:#eef3ec;  /* sauge très clair */
  --fg:#15241a;         /* presque noir forêt */
  --muted:#667a68;      /* vert-gris */
  --line:#e5ece2;
  --brand:#2e8b57;      /* vert club (lisible, texte blanc OK) */
  --brand-soft:#e4f3e1; /* remplissage vert doux */
  --brand-ink:#063e0b;  /* vert forêt foncé — titres/forts */
  --accent:#4fb86a;     /* vert vif club */
  --accent-soft:#e7f8e3;
  --ok:#2e9e5b;
  --ok-soft:#e2f4e5;
  --warn:#c98a12;
  --warn-soft:#f8ecca;
  --danger:#d6453f;
  --danger-soft:#fbe4e2;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 10px 30px -14px rgba(10,40,20,.26);
  --font-display:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",sans-serif;
  --font-body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#071a0c; --bg:#0a1a0e; --surface:#122018; --surface-2:#1a2c20;
  --fg:#e9f3ea; --muted:#9bb49f; --line:#223528; --brand:#5cc47e; --brand-soft:#15321f; --brand-ink:#9fe6b2;
  --accent:#6fd389; --accent-soft:#163020; --ok:#4fc27e; --ok-soft:#133a26;
  --warn:#e2b545; --warn-soft:#3a2f10; --danger:#ef6a63; --danger-soft:#3a1a18;
  --shadow:0 14px 34px -14px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#071a0c; --bg:#0a1a0e; --surface:#122018; --surface-2:#1a2c20;
  --fg:#e9f3ea; --muted:#9bb49f; --line:#223528; --brand:#5cc47e; --brand-soft:#15321f; --brand-ink:#9fe6b2;
  --accent:#6fd389; --accent-soft:#163020; --ok:#4fc27e; --ok-soft:#133a26;
  --warn:#e2b545; --warn-soft:#3a2f10; --danger:#ef6a63; --danger-soft:#3a1a18;
  --shadow:0 14px 34px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:
  radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb,var(--brand) 14%,transparent), transparent 60%),
  var(--bg);
  color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
input,select{font-family:inherit;font-size:15px}

/* App shell = phone frame. Hauteur fixe (pas min-height) : .screen (flex:1
   overflow-y:auto) doit avoir une hauteur bornée pour défiler en interne —
   sinon .app grandit avec son contenu, c'est la page qui défile, et
   .sheet-backdrop (position:absolute;inset:0 sur .app) s'étire sur toute
   cette hauteur au lieu du viewport, rendant le panneau du bas invisible. */
.app{max-width:440px;margin:0 auto;height:100%;background:var(--surface);
  position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 0 1px var(--line);overflow:hidden}
@media(min-width:472px){.app{margin:18px auto;height:calc(100% - 36px);border-radius:30px}}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  padding:14px max(16px,env(safe-area-inset-left,0)) 12px max(16px,env(safe-area-inset-right,0));min-height:56px}
.topbar .back{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:10px;
  color:var(--fg);font-size:17px;display:grid;place-items:center;flex:none}
.topbar h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .step{font-size:12px;color:var(--muted);font-weight:600;flex:none}

/* En-tête figé affiché pendant la gestion d'un tournoi (Accueil/Planning/Poules/Valider/Finale) */
.orgheader{background:var(--surface);border-bottom:1px solid var(--line);flex:none;
  padding:12px max(16px,env(safe-area-inset-left,0)) 10px max(16px,env(safe-area-inset-right,0));
  display:flex;flex-direction:column;gap:8px}
.orgheader .row1{display:flex;align-items:center;gap:8px;min-width:0}
.orgheader .row2{display:flex;align-items:center;gap:8px;min-width:0}
.orgheader .row2 b{font-family:var(--font-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

/* Screen scroll area */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;
  --pad-y:18px;--pad-x:max(16px,env(safe-area-inset-left,0));
  padding:var(--pad-y) max(16px,env(safe-area-inset-right,0)) 26px var(--pad-x)}
.screen.flush{padding-left:0;padding-right:0}
[hidden]{display:none!important}

/* Typographic bits */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.muted{color:var(--muted)}
.lead{color:var(--muted);font-size:14.5px;margin:6px 0 0}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:none;border-radius:14px;padding:15px 18px;font-size:15.5px;font-weight:700;
  background:var(--brand);color:#fff;letter-spacing:-.01em}
.btn.accent{background:var(--accent)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn);color:#fff}
.btn.sm{padding:10px 14px;font-size:13.5px;width:auto;border-radius:11px}
.btn.outline{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.btn:disabled{opacity:.45}
.btn-row{display:flex;gap:10px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card+.card{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}

/* Home hero */
.hero{color:#fff;border-radius:26px;padding:26px 22px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#063e0b,#1f7a43 58%,#2e8b57);box-shadow:var(--shadow)}
.hero .ball{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
  background:conic-gradient(from 20deg,#83dc7a,#c7f3bf,#4fb86a,#83dc7a);opacity:.85;filter:blur(2px)}
.hero h1{font-size:29px;line-height:1.04;color:#fff;position:relative;font-weight:800}
.hero p{position:relative;margin:10px 0 0;color:#dbf1e2;font-size:14.5px;max-width:26ch}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo .mark{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(10,40,20,.08);
  display:grid;place-items:center;overflow:hidden;flex:none}
.logo .mark img{width:84%;height:84%;object-fit:contain;display:block}
.logo .mark.plain{background:transparent}
.logo .mark.plain img{width:100%;height:100%}

/* Entry tiles */
.entry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--radius);padding:17px;color:var(--fg)}
.entry .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none}
.entry b{font-family:var(--font-display);font-size:16px}
.entry small{color:var(--muted);display:block;margin-top:2px}
.entry .chev{margin-left:auto;color:var(--muted);font-size:20px}

/* Form fields */
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--fg)}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand)}
.pwd-wrap{position:relative;display:block}
.pwd-wrap input{padding-right:46px}
.pwd-eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:9px;padding:0}
.pwd-eye:hover{color:var(--brand);background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Stepper (number controls) */
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:44px;height:46px;border:none;background:var(--surface-2);color:var(--fg);font-size:20px;font-weight:700}
.stepper input{flex:1;min-width:0;text-align:center;border:none;font-weight:800;font-size:17px;background:var(--surface);color:var(--fg);
  font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none}

/* Toggle */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:none}
.toggle b{font-weight:600;font-size:14.5px}
.toggle small{color:var(--muted);display:block;font-size:12.5px}
.sw{width:48px;height:28px;border-radius:20px;background:var(--line);border:none;position:relative;flex:none;transition:.18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--brand)}
.sw.on::after{left:23px}

/* Progress bar for wizard */
.wiz-prog{display:flex;gap:5px;padding:0 max(16px,env(safe-area-inset-left,0));margin-top:-2px;margin-bottom:2px}
.wiz-prog span{flex:1;height:4px;border-radius:3px;background:var(--line)}
.wiz-prog span.done{background:var(--brand)}
.wiz-prog span.cur{background:var(--accent)}

/* Chips / badges */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;
  background:var(--surface-2);color:var(--muted)}
.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap;flex:none}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.wait{background:var(--surface-2);color:var(--muted)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.note-brand{display:block;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:700;
  line-height:1.45;padding:9px 12px;border-radius:12px}

/* Accueil organisateur · Terrains en cours (ligne compacte par match) */
.live-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--warn-soft)}
.live-row+.live-row{margin-top:6px}
.live-row .court{width:28px;height:28px;border-radius:9px;background:var(--surface);color:var(--warn);
  display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.live-row .teams{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.live-row .pool{flex:none;font-size:11px;font-weight:700;color:var(--muted)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none;animation:liveblink 1.6s ease-in-out infinite}
@keyframes liveblink{0%,100%{opacity:1}50%{opacity:.35}}

/* Gym block */
.gymhead{display:flex;align-items:center;gap:9px;margin:18px 0 10px}
.gymhead .dot{width:10px;height:10px;border-radius:50%;flex:none}
.gymhead h3{font-size:15px}
.gymhead .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
/* Planning : le tour déplié est mis dans un cadre pour bien le distinguer des
   tours repliés au-dessus/en-dessous (couleur du cadre = statut du tour). */
.round{margin:18px 0 10px}
.round .gymhead{margin:0}
/* Ligne de séparation entre deux tours repliés consécutifs (les tours ouverts
   ont déjà leur propre cadre, donc pas besoin de ligne en plus autour d'eux). */
.round:not(.open)+.round:not(.open){border-top:1px solid var(--line);padding-top:12px}
.round.open{border:2px solid var(--round-col,var(--brand));border-radius:16px;background:var(--round-bg,var(--brand-soft));padding:12px 12px 14px;margin:18px 0 14px}
.round.open .gymhead{margin:0 0 10px}
.gymblock{border:1px solid var(--line);border-left:5px solid var(--gc,var(--brand));border-radius:16px;padding:12px 12px 14px;margin-top:16px;background:color-mix(in srgb, var(--gc,var(--brand)) 7%, var(--surface))}
.gymblock .gymhead{margin:2px 2px 12px}
.gymblock .badge-gym{display:inline-flex;align-items:center;gap:7px;background:var(--gc,var(--brand));color:#fff;padding:5px 12px;border-radius:999px;font-weight:800;font-size:13.5px;font-family:var(--font-display);letter-spacing:-.01em}

/* Pool card */
.pool{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pool+.pool{margin-top:10px}
.pool .ph{display:flex;align-items:center;gap:8px;padding:11px 13px;background:var(--surface-2);font-weight:800;font-family:var(--font-display)}
.pool .ph .tn{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.pool ul{list-style:none;margin:0;padding:4px 0}
.pool li{display:flex;align-items:flex-start;gap:9px;padding:10px 13px;font-size:14px}
.pool li .lvdot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
.pool li .tinfo{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pool li .tinfo .tname{font-weight:600;line-height:1.3;word-break:break-word}
.pool li .tinfo .lvtag{font-size:11px;font-weight:700}
.pool li .tinfo .movepool{align-self:flex-start;margin-top:1px}
.pool li .seed{width:22px;height:22px;border-radius:7px;background:var(--brand-soft);color:var(--brand);
  font-size:11px;font-weight:800;display:grid;place-items:center;flex:none}

/* Carte équipe (éditeur de répartition phase 2) */
.p2card{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;background:var(--surface);
  display:flex;align-items:flex-start;gap:10px}
.p2card .seed{min-width:22px;height:22px;padding:0 5px;border-radius:7px;background:var(--brand-soft);color:var(--brand);
  font-size:11px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:2px}
.p2card .p2info{min-width:0;flex:1}
.p2card .p2name{font-weight:700;line-height:1.3;word-break:break-word}
.p2card .p2meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.p2card .p2moveto{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.p2card .p2moveto .p2movelbl{font-size:11px;color:var(--muted);margin-right:2px}
.p2card .p2moveto .p2pool{height:30px;padding:0 10px;border-radius:8px;border:1.5px solid var(--brand-soft);
  background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:12.5px;font-family:var(--font-display)}
.p2card .p2moveto .p2pool:active{opacity:.75}

/* Standings table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:center;padding:8px 4px;font-weight:700}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:12px}
.tbl td{padding:10px 4px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td:first-child{font-weight:600}
.tbl tr.qual td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.tbl .tcell{display:inline-flex;flex-direction:column;gap:3px;vertical-align:middle}
.rk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--surface-2);
  font-size:11px;font-weight:800;margin-right:7px}
.rk.top{background:var(--ok-soft);color:var(--ok)}

/* Match card */
.match{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.match+.match{margin-top:10px}
/* Planning : distinguer d'un coup d'œil à venir / en cours / terminé (au-delà du badge,
   trop proche visuellement entre "brand" et "ok"). */
.match.upcoming{border-left-color:var(--brand)}
.match.live{border-left-color:var(--warn);background:var(--warn-soft)}
.match.done{border-left-color:var(--ok);background:var(--surface-2);opacity:.74}
/* Sections « Mes matchs » (capitaine) */
.mm-sep{margin:24px 0 10px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;
  font-family:var(--font-display);font-weight:800;font-size:15.5px;letter-spacing:-.01em}
.mm-sep.first{border-top:none;padding-top:0;margin-top:16px}
.mm-sep .ic{display:inline-flex;align-items:center;font-size:16px}
.ref-panel{border:2px solid var(--brand);background:var(--brand-soft);border-radius:18px;padding:13px 13px 6px;margin-top:18px}
.ref-panel .rp-head{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;
  font-size:15.5px;color:var(--brand);letter-spacing:-.01em}
.ref-panel .rp-sub{font-size:12px;color:var(--brand);opacity:.9;margin:7px 0 11px;line-height:1.45;font-weight:600}
.match .meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:700}
.match .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.match .teams .t{font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}
.match .teams .sc{font-family:var(--font-display);font-weight:800;font-size:20px;display:flex;gap:6px;align-items:center;
  font-variant-numeric:tabular-nums}
.match .teams .sc .vs{color:var(--muted);font-size:13px;font-weight:700}
.lvbadge{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}

/* Score entry big inputs */
.scorebox{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:8px 0}
.scorebox .tlab{font-weight:800;font-family:var(--font-display);font-size:15px;text-align:center}
.scorebox .num{width:100%;height:84px;border:2px solid var(--line);border-radius:16px;text-align:center;
  font-family:var(--font-display);font-weight:800;font-size:40px;background:var(--surface);color:var(--fg);
  font-variant-numeric:tabular-nums}
.scorebox .num:focus{outline:none;border-color:var(--brand)}
.scorebox .dash{color:var(--muted);font-size:24px;font-weight:800}
.scorebox .setlab{grid-column:1/-1;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:-4px}

/* QR */
.qrwrap{display:grid;place-items:center;gap:16px;padding:24px 0}
.qrcard{background:#fff;padding:18px;border-radius:22px;box-shadow:var(--shadow)}
#qrcode img,#qrcode canvas{display:block;border-radius:6px}
.joincode{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:.18em;
  background:var(--surface-2);padding:10px 18px;border-radius:12px}

/* Bottom tab bar */
.tabbar{position:sticky;bottom:0;z-index:20;display:flex;gap:4px;background:var(--surface);
  border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-left,0)) calc(8px + env(safe-area-inset-bottom,0)) max(10px,env(safe-area-inset-right,0))}
.tabbar button{flex:1;border:none;background:none;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:6px 2px;border-radius:14px;
  position:relative;transition:color .18s ease,background .18s ease;-webkit-tap-highlight-color:transparent}
.tabbar button:active{background:var(--surface-2)}
.tabbar button .ti{font-size:20px;line-height:1;transition:transform .18s ease}
.tabbar button.on{color:var(--brand);background:var(--brand-soft)}
.tabbar button.on .ti{transform:translateY(-1px) scale(1.1)}

/* Bracket */
.bracket{--bgap:22px;display:flex;align-items:stretch;overflow-x:auto;padding:4px 2px 12px}
.round{display:flex;flex-direction:column;flex:0 0 var(--rw,150px);min-width:var(--rw,150px)}
.round:not(:last-child){padding-right:var(--bgap)}
.round h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;margin:0 0 8px;height:14px}
.rmatches{flex:1;display:flex;flex-direction:column}
.rmatch{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}
.bm{border:1px solid var(--line);border-radius:11px;overflow:hidden;font-size:12.5px;background:var(--surface);margin:7px 0}
.bm .r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 11px;min-height:36px}
.bm .r+.r{border-top:1px solid var(--line)}
.bm .nm{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.bm .nm .nmtxt{font-weight:600;overflow-wrap:break-word;word-break:break-word}
.bm .nm .lvbadge{margin-bottom:3px}
.bm .sc{display:flex;gap:7px;flex:none}
.bm .sc b{display:inline-block;min-width:15px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.bm .r.win{background:var(--ok-soft)}
.bm .r.win .nmtxt{font-weight:800}
.bm .r.win .sc b{color:var(--fg)}
.bm.tap{cursor:pointer}
.bm.tap .bmEdit{position:absolute;top:50%;right:9px;transform:translateY(-50%);font-size:13px;opacity:.55;pointer-events:none}
.bm.tap .r{padding-right:28px}

/* Podium */
.podium{display:flex;align-items:flex-end;gap:8px;margin:16px 0 6px}
.podium .pcard{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.podium .pcard .medal{font-size:22px;line-height:1}
.podium .pcard .pname{font-weight:800;font-size:12.5px;line-height:1.25;word-break:break-word;min-height:2.6em;display:flex;align-items:center}
.podium .pcard .prank{font-size:11px;color:var(--muted);font-weight:700}
.podium .p1{padding-top:22px;padding-bottom:20px;background:var(--ok-soft);border-color:var(--ok)}
.podium .p1 .pname{color:var(--ok-ink,var(--brand-ink))}
.round:not(:last-child) .rmatch::after{content:'';position:absolute;top:50%;left:100%;width:calc(var(--bgap)/2);height:2px;margin-top:-1px;background:var(--line)}
.round:not(:last-child) .rmatch::before{content:'';position:absolute;left:calc(100% + var(--bgap)/2);width:calc(var(--bgap)/2);border-left:2px solid var(--line)}
.round:not(:last-child) .rmatch:nth-child(odd)::before{top:50%;bottom:0;border-bottom:2px solid var(--line)}
.round:not(:last-child) .rmatch:nth-child(even)::before{top:0;bottom:50%;border-top:2px solid var(--line)}

/* Segmented control */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin:6px 0 14px}
.seg button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg-strong{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:5px;gap:5px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.segdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;vertical-align:middle}
.segdot.done{background:var(--ok)}
.segdot.live{background:var(--warn)}
.seg-strong button{padding:11px 6px;font-size:13.5px;font-weight:800;border-radius:10px;border:1.5px solid transparent}
.seg-strong button.on{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand);box-shadow:0 2px 6px rgba(0,0,0,.1)}
/* Bloc de sélecteurs figé en haut de l'écran au défilement : rappel visuel +
   changement rapide sans devoir remonter tout en haut. */
.filter-sticky{position:sticky;top:calc(var(--pad-y) * -1);z-index:3;background:var(--surface);
  margin:calc(var(--pad-y) * -1) calc(var(--pad-x) * -1) 10px;padding:var(--pad-y) var(--pad-x) 10px;
  border-bottom:1px solid var(--line);box-shadow:0 8px 14px -10px rgba(0,0,0,.3)}
.filter-sticky:last-child{margin-bottom:calc(var(--pad-y) * -1)}

/* Phase flow */
.phase{display:flex;gap:12px;align-items:flex-start}
.phase .num{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);
  font-weight:800;display:grid;place-items:center;flex:none;font-family:var(--font-display)}
.phase+.phase{margin-top:14px}
.phase b{font-family:var(--font-display);font-size:15px}
.phase small{display:block;color:var(--muted);margin-top:2px;font-size:13px}
.phase .line{width:2px;background:var(--line);margin:4px auto 0;height:14px}

/* Toast */
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);z-index:90;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13.5px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;max-width:360px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
:root[data-theme="dark"] .toast,:root:not([data-theme="light"]) .toast{background:#000}

.demo-note{font-size:11.5px;color:var(--muted);text-align:center;padding:10px 20px 2px}
.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.summary-row:first-child{border-top:none}
.summary-row b{font-weight:700}
.list-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px}
.list-item+.list-item{margin-top:10px}
.tour{margin-top:10px}
.tour-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:inherit;font-weight:700;font-size:11.5px;padding:6px 11px;border-radius:9px;cursor:pointer}
.tbtn:hover{color:var(--fg);border-color:var(--muted)}
.tcard{cursor:pointer}
.empty{text-align:center;padding:38px 16px;color:var(--muted);font-size:30px}
.empty p{font-size:13.5px;font-weight:600;margin:12px 0 0;line-height:1.5}
.list-item .ic{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-size:19px;flex:none}
.list-item b{font-family:var(--font-display);font-size:15px}
.list-item small{color:var(--muted);display:block}
.list-item .chev{margin-left:auto;color:var(--muted)}
.list-item .ic.has-img{background:none;padding:0;overflow:hidden}
.list-item .ic.has-img img{width:100%;height:100%;object-fit:cover}
.phase-mini{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:11px;font-weight:800;color:var(--brand)}
.phase-mini .bars{display:inline-flex;gap:3px}
.phase-mini .ps{width:15px;height:5px;border-radius:3px;background:var(--line)}
.phase-mini .ps.done{background:var(--ok)}
.phase-mini .ps.cur{background:var(--brand)}
/* Sélecteur d'image (création) */
.img-pick{display:block;width:100%;height:128px;border:1.5px dashed var(--line);border-radius:14px;
  overflow:hidden;cursor:pointer;background:var(--surface-2)}
.img-pick img{width:100%;height:100%;object-fit:cover;display:block}
.img-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted)}
.img-ph small{font-size:12.5px;font-weight:600}
/* Bottom sheet (pop-up) */
.sheet-backdrop{position:absolute;inset:0;z-index:80;background:rgba(10,13,30,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;opacity:0;transition:opacity .22s ease}
.sheet-backdrop.show{opacity:1}
.sheet{position:relative;width:100%;max-height:90%;overflow-y:auto;overflow-x:hidden;background:var(--surface);
  border-radius:26px 26px 0 0;padding:10px 18px 24px;box-shadow:0 -22px 60px rgba(0,0,0,.4);border-top:4px solid var(--brand);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1)}
.sheet-backdrop.show .sheet{transform:translateY(0)}
.sheet .grab{width:46px;height:5px;border-radius:3px;background:var(--brand);opacity:.5;margin:5px auto 12px}
.sheet-close{position:absolute;top:12px;right:14px;z-index:2;width:30px;height:30px;border:none;border-radius:50%;
  background:var(--surface);color:var(--muted);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sheet-close:hover{color:var(--fg)}
.btn.theme-toggle{width:36px;height:36px;padding:0;border-radius:50%;font-size:15px;flex:none}
.sheet h3.sheet-title{font-size:18px;margin:2px 0 12px}

/* Petits écrans (< 392px) : on resserre pour éviter les débordements */
@media (max-width:391px){
  body{font-size:14.5px}
  .screen{--pad-y:14px;--pad-x:max(12px,env(safe-area-inset-left,0));padding:var(--pad-y) max(12px,env(safe-area-inset-right,0)) 22px var(--pad-x)}
  .topbar{padding:12px max(12px,env(safe-area-inset-left,0)) 10px max(12px,env(safe-area-inset-right,0))}
  .card{padding:13px;border-radius:15px}
  .hero{padding:20px 17px;border-radius:22px}
  .hero h1{font-size:25px}
  .btn{padding:13px 14px;font-size:14.5px;border-radius:13px}
  .btn.sm{padding:9px 11px;font-size:12.5px}
  .btn-row{gap:8px}
  .grid2{gap:8px}
  .entry{gap:11px;padding:13px}
  .entry .ic{width:40px;height:40px;border-radius:11px;font-size:19px}
  .list-item{gap:10px;padding:12px}
  .list-item .ic{width:38px;height:38px;border-radius:11px}
  .seg{gap:3px;padding:3px}
  .seg button{padding:8px 4px;font-size:12.5px}
  .logo{font-size:17px;gap:8px}
  .logo .mark{width:32px;height:32px}
  .sheet{padding:8px 14px 20px}
  .pool .ph select,.pool li select{max-width:108px}
  /* Rétrécir le texte pour garder la mise en page sur une ligne */
  .entry b,.list-item b{font-size:14px}
  .entry small,.list-item small{font-size:11.5px}
  .list-item small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:10px;padding:3px 7px;white-space:nowrap}
  .summary-row{font-size:13px}
  .lead{font-size:13.5px}
  .eyebrow{font-size:11px}
  .chip{font-size:10.5px}
  .match .teams .t{font-size:13.5px}
}
@media (max-width:359px){
  body{font-size:13.5px}
  .btn{font-size:13.5px;padding:12px 12px}
  .entry b,.list-item b{font-size:13px}
  .entry small,.list-item small{font-size:11px}
  .hero h1{font-size:22px}
  .logo{font-size:16px}
}

/* Desktop (≥860px) : l'app quitte le gabarit « téléphone » pour profiter de la
   largeur de l'écran. Les écrans à une seule colonne (connexion, formulaires…)
   restent centrés et resserrés via .screen.narrow (posée côté JS dans render(),
   voir NARROW_SCREENS) pour rester lisibles ; les écrans à listes (tournois,
   planning, référents) passent en grille 2 colonnes via .tour-grid / .sched-grid /
   .refs-grid (wrappers ajoutés dans le JS des écrans concernés). */
@media(min-width:860px){
  .app{max-width:1040px;border-radius:26px}
  .screen{--pad-y:30px;--pad-x:max(32px,env(safe-area-inset-left,0));padding:var(--pad-y) max(32px,env(safe-area-inset-right,0)) 40px var(--pad-x)}
  .topbar{padding-left:max(32px,env(safe-area-inset-left,0));padding-right:max(32px,env(safe-area-inset-right,0))}
  .screen.narrow{max-width:560px;margin-left:auto;margin-right:auto}
  .tour-grid,.refs-grid,.sched-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tour-grid .tour{margin-top:0}
  .refs-grid .list-item,.refs-grid .list-item+.list-item{margin-top:0}
  .sched-grid .match,.sched-grid .match+.match{margin-top:0}
}

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script>
/* ---------- API OVH (PHP + MySQL, même domaine) ----------
   Tout passe par ./api/ : authentification par cookie de session, aucune
   clé ni CORS. window.api est un petit client fetch ; window.sb reste un
   simple drapeau « backend disponible » pour le reste du code. */
window.API_BASE = './api/';
window.api = (function(){
  async function call(action, opts){
    opts = opts || {};
    let url = API_BASE + '?action=' + encodeURIComponent(action);
    if(opts.query){ for(const k in opts.query){ const v=opts.query[k]; if(v!=null) url += '&'+encodeURIComponent(k)+'='+encodeURIComponent(v); } }
    const init = { method: opts.method || (opts.body!==undefined ? 'POST' : 'GET'),
                   headers:{}, credentials:'same-origin' };
    if(opts.body!==undefined){ init.headers['Content-Type']='application/json'; init.body=JSON.stringify(opts.body); }
    let res;
    try{ res = await fetch(url, init); }
    catch(e){ const err=new Error('Réseau indisponible'); err.network=true; throw err; }
    let data=null; try{ data = await res.json(); }catch(_){}
    if(!res.ok){ const err=new Error((data&&data.error)||('Erreur '+res.status)); err.status=res.status; throw err; }
    return data;
  }
  return {
    call,
    login:          (email,password)=> call('auth.login',  {body:{email,password}}),
    logout:         ()=>               call('auth.logout', {method:'POST'}),
    me:             ()=>               call('auth.me'),
    changePassword: (password)=>       call('auth.changePassword', {body:{password}}),
    listTournaments:()=>               call('tournaments.list'),
    saveTournament: (id,row)=>         call('tournaments.save',        {body:{id,row}}),
    setArchived:    (id,archived)=>    call('tournaments.setArchived', {body:{id,archived}}),
    setStatus:      (id,status,extra)=> call('tournaments.setStatus',  {body:Object.assign({id,status},extra||{})}),
    removeTournament:(id)=>            call('tournaments.remove',      {body:{id}}),
    saveStructure:  (tid,s)=>          call('tournaments.saveStructure',{body:{tid,s}}),
    addPhase:       (tid,s)=>          call('tournaments.addPhase',    {body:{tid,s}}),
    loadStructure:  (tid)=>            call('tournaments.loadStructure',{query:{tid}}),
    setMatchScore:  (id,sets,complete)=> call('matches.setScore',       {body:{id,sets,complete}}),
    submitCaptainScore:(matchId,teamName,sets)=> call('matches.submitCaptainScore', {body:{matchId,teamName,sets}}),
    startMatch:     (matchId,teamName)=> call('matches.startMatch',     {body:{matchId,teamName}}),
    adminStartMatch:(matchId)=>        call('matches.adminStartMatch', {body:{matchId}}),
    listConflicts:  (tid)=>            call('matches.conflicts',       {query:{tid}}),
    resolveConflict:(matchId,payload)=> call('matches.resolveConflict', {body:Object.assign({matchId},payload||{})}),
    publicByCode:   (code,team)=>      call('tournaments.publicByCode', {query:{code, team:team||undefined}}),
    listReferents:  ()=>               call('referents.list'),
    createReferent: (name,email,password)=> call('referents.create',   {body:{name,email,password}}),
    setReferentStatus:(id,status)=>    call('referents.setStatus',     {body:{id,status}}),
    removeReferent: (id)=>             call('referents.remove',        {body:{id}}),
    listOrganizers: ()=>               call('organizers.list'),
    createOrganizer:(name,email,password)=> call('organizers.create', {body:{name,email,password}}),
    setOrganizerStatus:(id,status)=>   call('organizers.setStatus',    {body:{id,status}}),
    removeOrganizer:(id)=>             call('organizers.remove',       {body:{id}}),
  };
})();
// Drapeau « backend présent » : le code existant teste window.sb un peu partout.
window.sb = { _ovh:true };
</script>
<script>
/* ---------- Couche données (API OVH) ----------
   Persiste les tournois dans la table `tournaments`. `config` (texte JSON)
   porte tout le paramétrage de l'app ; on y range aussi gymnases / équipes /
   étape du brouillon (_gyms, _teams, _step) pour un aller-retour fidèle. Les
   colonnes name / event_date / place / status / join_code / live_phase sont
   tenues à jour en parallèle (affichage + requêtes). */
(function(){
  if(!window.api){ window.vboDb = null; return; }
  const isUuid = (v)=> typeof v==='string'
    && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
  function toISODate(d){
    if(!d) return null;
    if(typeof d==='string' && /^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0,10);
    const t=Date.parse(d); return isNaN(t) ? null : new Date(t).toISOString().slice(0,10);
  }
  // objet tournoi (app) -> ligne vbo.tournaments
  function toRow(t){
    const cfg = Object.assign({}, t.config||{});
    cfg._gyms  = t.gyms  || [];
    cfg._teams = t.teams || [];
    cfg._step  = t.step  || 0;
    return {
      name:       (t.config&&t.config.name)  || 'Tournoi',
      event_date: toISODate(t.config&&t.config.date),
      place:      (t.config&&t.config.place) || null,
      status:     t.status   || 'draft',
      archived:   !!t.archived,
      join_code:  t.joinCode || null,
      live_phase: t.livePhase|| 'brassage',
      config:     cfg,
    };
  }
  // ligne vbo.tournaments -> objet tournoi (app)
  function fromRow(r){
    const cfg = Object.assign({}, r.config||{});
    const gyms = cfg._gyms || [], teams = cfg._teams || [], step = cfg._step || 0;
    delete cfg._gyms; delete cfg._teams; delete cfg._step;
    if(!cfg.name  && r.name)       cfg.name  = r.name;
    if(!cfg.date  && r.event_date) cfg.date  = r.event_date;
    if(!cfg.place && r.place)      cfg.place = r.place;
    return {
      id: r.id,
      status: r.status || 'draft',
      archived: !!r.archived,
      config: cfg, gyms, teams, step,
      joinCode: r.join_code || null,
      livePhase: r.live_phase || 'brassage',
      launchedAt: r.launched_at ? Date.parse(r.launched_at) : undefined,
      closedAt:   r.closed_at   ? Date.parse(r.closed_at)   : undefined,
      savedAt:    r.created_at  ? Date.parse(r.created_at)  : undefined,
      _sb: true,
    };
  }
  window.vboDb = {
    isUuid, fromRow,
    async list(){
      const rows = await api.listTournaments();
      return (rows||[]).map(fromRow);
    },
    // Enregistre : INSERT si l'id local n'est pas un uuid, sinon UPDATE.
    // Renvoie l'id définitif (uuid DB) pour réconcilier l'objet local.
    async save(t, extra){
      const row = Object.assign(toRow(t), extra||{});
      const res = await api.saveTournament(isUuid(t.id) ? t.id : null, row);
      return res.id;
    },
    async setArchived(id, archived){
      if(!isUuid(id)) return;
      await api.setArchived(id, !!archived);
    },
    async setStatus(id, status, extra){
      if(!isUuid(id)) return;
      await api.setStatus(id, status, extra||{});
    },
    async remove(id){
      if(!isUuid(id)) return;
      await api.removeTournament(id);
    },
    // Persiste la structure du tournoi (gymnases, équipes, poules, matchs de
    // brassage). Le serveur efface l'ancienne et réinsère tout, et fait tout
    // le mapping des clés ; ici on ne fait que transporter `s`.
    // `s` = { gyms:[{key,name,position}], teams:[{key,name,levelW}],
    //         pools:[{letter,phase,gymKey,court,teamKeys:[]}],
    //         matches:[{round,time,phase,poolKey,gymName,court,aKey,bKey,refKey}] }
    async saveStructure(tid, s){
      if(!isUuid(tid)) throw new Error('Tournoi non encore enregistré.');
      return await api.saveStructure(tid, s);
    },
    // Ajoute les poules/matchs d'une nouvelle phase (Principale/Consolante…) sans
    // toucher à ce qui est déjà enregistré (contrairement à saveStructure).
    async addPhase(tid, s){
      if(!isUuid(tid)) throw new Error('Tournoi non encore enregistré.');
      return await api.addPhase(tid, s);
    },
    // Relit la structure persistée ; le serveur renvoie déjà les formes
    // attendues par l'app ({ pools, schedule }), ou null si rien n'est persisté.
    async loadStructure(tid){
      if(!isUuid(tid)) return null;
      return await api.loadStructure(tid);
    },
    // Saisie manuelle d'un score (admin/référent) : `sets` = [[sa,sb], ...].
    // `complete` indique si tous les sets du match sont saisis (sinon le match
    // reste 'upcoming' : possibilité de valider le score set par set).
    async setMatchScore(matchId, sets, complete){
      if(!isUuid(matchId)) throw new Error('Match non synchronisé — rouvrez le tournoi.');
      return await api.setMatchScore(matchId, sets, complete);
    },
    // Bascule un match en "live" depuis le planning (organisation), sans
    // attendre qu'une équipe le fasse elle-même sur le terrain.
    async adminStartMatch(matchId){
      if(!isUuid(matchId)) throw new Error('Match non synchronisé — rouvrez le tournoi.');
      return await api.adminStartMatch(matchId);
    },
    // Matchs où les deux capitaines ont saisi des scores différents (écran Valider).
    async listConflicts(tid){
      if(!isUuid(tid)) return [];
      return await api.listConflicts(tid);
    },
    // Tranche un conflit : {pick:'a'|'b'} reprend la saisie d'un capitaine,
    // {sets:[[sa,sb],...]} impose un score saisi par l'organisation.
    async resolveConflict(matchId, payload){
      if(!isUuid(matchId)) throw new Error('Match non synchronisé — rouvrez le tournoi.');
      return await api.resolveConflict(matchId, payload);
    },
  };
})();
</script>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rebuildPools(){
  const P=state.config.pools, T=state.config.teamsPerPool, G=state.config.gyms;
  const cpg=state.config.courtsPerGym||[];
  const pools=[];
  for(let i=0;i<P;i++) pools.push({letter:POOL_LETTERS[i]||('P'+(i+1)), gym:null, court:1, teams:[]});
  const perGym=Math.ceil(P/G);
  // Chaque gymnase a ses propres terrains, numérotés 1..N dans chaque gymnase
  const gymCourts=[];
  for(let gi=0;gi<G;gi++) gymCourts.push(Math.max(1, cpg[gi]||1));
  pools.forEach((p,i)=>{
    const gi=Math.min(G-1, Math.floor(i/perGym));
    p.gym = GYMS[gi].id;
    const idxInGym = i - gi*perGym;              // rang de la poule dans son gymnase
    p.court = (idxInGym % gymCourts[gi]) + 1;    // terrains locaux au gymnase : 1, 2, 3…
  });
  // Liste des terrains disponibles par gymnase (pour le sélecteur manuel)
  state.courtsByGym={};
  for(let gi=0;gi<G;gi++){ state.courtsByGym[GYMS[gi].id]=Array.from({length:gymCourts[gi]},(_,k)=>k+1); }
  // On part des équipes inscrites avec leur niveau
  let order = state.teams.slice(0, P*T).map(x=>({t:x.name, level:x.level}));
  if(state.config.distribution==='random') shuffle(order);
  else if(state.config.distribution==='snake') order.sort((a,b)=> levelMeta(b.level).w - levelMeta(a.level).w); // tête de série = niveau le plus fort
  if(state.config.distribution==='manual'){
    order.forEach((o,idx)=> pools[Math.floor(idx/T)].teams.push(o));
  } else {
    // Serpentin : poule A←nº1, B←nº2 … puis on repart en sens inverse
    let idx=0;
    for(let r=0;r<T;r++){
      const seq = r%2===0 ? [...Array(P).keys()] : [...Array(P).keys()].reverse();
      for(const pi of seq){ if(idx<order.length) pools[pi].teams.push(order[idx++]); }
    }
  }
  state.pools=pools;
  state.phasePrincipal=null; state.phaseConsolante=null; // recalculées à la demande
  buildSchedule();
}

// Matchs d'un capitaine dérivés du planning réel (tous : joués, en cours, à venir).
// m.status vient de l'API (3 valeurs possibles : 'done'/'live'/'upcoming' — voir

// distinguant, parmi les matchs "live", ceux où CE capitaine a déjà saisi son

// chargement : survit à une perte de connexion / un rechargement de page.
function captainMatches(team){
  return (state.schedule||[]).map((m)=>{
    const mine = (state.myEntries&&state.myEntries[m.id]) || null;
    const status = m.status==='done' ? 'valid' : m.status==='live' ? (mine?'pending':'live') : 'todo';
    return {
      id:m.id, round:m.r, time:m.time, pool:m.pool, court:m.court, gym:m.gym, ref:m.ref,
      a:m.a, b:m.b,
      sa: status==='valid'?m.sa:null,
      sb: status==='valid'?m.sb:null,
      sets: status==='valid'?m.sets:null,
      status, mine,
    };
  }).filter(m=>m.a===team||m.b===team);
}
function captainRefMatches(team){

  }));

function gymColor(name){ const g=GYMS.find(x=>x.name===name); return g?g.color:'var(--brand)'; }
function roundRobin(list){
  const a=list.slice(); if(a.length%2) a.push(null);
  const n=a.length, rounds=[];
  for(let r=0;r<Math.max(0,n-1);r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){ if(a[i]&&a[n-1-i]) pairs.push([a[i],a[n-1-i]]); }
    rounds.push(pairs);
    a.splice(1,0,a.pop());
  }
  return rounds;
}
var schedHoraire=null; // horaire actif pendant la construction d'un planning (null → brassage/config)
function slotTime(r){
  const c=schedHoraire||state.config||{};
  const parts=String(c.startTime||'09:00').split(':');
  const sh=(+parts[0])||9, sm=(+parts[1])||0;
  const per=((+c.roundMinutes)||20)+((+c.setupMinutes)||10);
  const t=(sh*60+sm)+(r-1)*per, h=Math.floor(t/60)%24, m=t%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
// Sets effectivement joués (valeurs non nulles) : un match peut être saisi
// set par set, donc `m.sets` peut contenir des sets non encore joués.
function matchSetsPlayed(m){
  const sets=(m.sets&&m.sets.length)?m.sets : (m.sa!=null?[[m.sa,m.sb]]:null);
  return sets ? sets.filter(s=>s&&s[0]!=null&&s[1]!=null) : [];
}
// Affichage d'un score (1 set → ancienne mise en forme ; plusieurs sets → set par set)
function scoreSC(m){
  const played=matchSetsPlayed(m);
  if(!played.length) return `<span class="vs">vs</span>`;
  if(played.length===1) return `<span>${played[0][0]}</span><span class="vs">–</span><span>${played[0][1]}</span>`;
  return `<span style="font-variant-numeric:tabular-nums;font-weight:800;font-size:12.5px;white-space:nowrap">${played.map(([a,b])=>`${a}-${b}`).join(' · ')}</span>`;

// Vainqueur d'un match (jamais de nul au volley) : d'abord les sets gagnés,
// puis, si le nombre de sets est pair et qu'on est à égalité de sets, le total de points.
// Renvoie 'a', 'b', ou null si le match n'est pas joué.
function matchWinner(m){
  const sets=(m.sets&&m.sets.length)?m.sets : (m.sa!=null?[[m.sa,m.sb]]:null);
  if(!sets) return null;
  let wa=0, wb=0, ta=0, tb=0;
  for(const [a,b] of sets){ if(a==null||b==null) continue; ta+=a; tb+=b; if(a>b) wa++; else if(b>a) wb++; }
  if(wa!==wb) return wa>wb?'a':'b';
  return ta>=tb?'a':'b'; // départage au total de points marqués

function wonBy(m, team){ const w=matchWinner(m); return w && ((w==='a'&&m.a===team)||(w==='b'&&m.b===team)); }
function gymCourtList(gymId, pools){
  if(state.courtsByGym && state.courtsByGym[gymId] && state.courtsByGym[gymId].length) return state.courtsByGym[gymId].slice();
  const s=[...new Set((pools||[]).filter(p=>p.gym===gymId).map(p=>p.court))].sort((a,b)=>a-b);
  return s.length?s:[1];
}
function buildSchedule(){ state.schedule = makeSchedule(state.pools, horaireFor('brassage')); }
function makeSchedule(poolsIn, hor){
  const pools=(poolsIn||[]).filter(p=>p.teams&&p.teams.length>=2);
  const prev=schedHoraire; schedHoraire=hor||null;
  const sched = (state.config.scheduleMode==='pool') ? makeSchedulePool(pools) : makeScheduleRotation(pools);
  assignReferees(sched, pools);

}
// Arbitrage : à chaque tour, une équipe au repos arbitre un match.
// Contraintes : un arbitre ne joue pas ce tour-là, arbitre au plus un match par tour,
// et arbitre uniquement dans le gymnase où son équipe joue.
function assignReferees(sched, pools){
  const teamGym={}; // chaque équipe est rattachée au gymnase où elle joue
  sched.forEach(m=>{ if(m.a) teamGym[m.a]=m.gym; if(m.b) teamGym[m.b]=m.gym; });
  const refCount={}; // nb de matchs déjà arbitrés par équipe (pour l'équité)
  Object.keys(teamGym).forEach(t=>{ refCount[t]=0; });
  const byR={};
  sched.forEach(m=>{ (byR[m.r]=byR[m.r]||[]).push(m); });
  Object.keys(byR).sort((a,b)=>a-b).forEach(r=>{
    const matches=byR[r];
    const playing=new Set();
    matches.forEach(m=>{ playing.add(m.a); playing.add(m.b); });
    // arbitres disponibles ce tour, regroupés par gymnase
    const idleByGym={};
    Object.keys(teamGym).forEach(t=>{ if(!playing.has(t)){ const g=teamGym[t]; (idleByGym[g]=idleByGym[g]||[]).push(t); } });
    const usedThisRound=new Set();
    matches.forEach(m=>{
      const pool=(idleByGym[m.gym]||[]).filter(t=>!usedThisRound.has(t));
      // on choisit l'équipe au repos qui a le MOINS arbitré jusqu'ici (équité)
      pool.sort((a,b)=> (refCount[a]-refCount[b]) || a.localeCompare(b));
      const pick=pool[0]||null;
      m.ref=pick; // même gymnase que le match, sinon pas d'arbitre
      if(pick){ refCount[pick]++; usedThisRound.add(pick); }
    });

}
// Mode « rotation » : chaque tour remplit TOUS les terrains disponibles de chaque gymnase.
// Les matchs d'une même poule (qui n'opposent jamais deux fois la même équipe dans un tour)
// peuvent occuper plusieurs terrains si le gymnase en a plus que de poules.
// Pour chaque gymnase, on aplatit le round-robin de chaque poule en une file de
// matchs et on remplit chaque tour terrain par terrain en donnant toujours la
// priorité à la poule ayant le plus de matchs restants : ça comble les terrains
// au maximum à chaque tour (plus de tour quasi-vide en fin de planning) tout en
// vérifiant qu'aucune équipe ne rejoue deux fois sur le même tour.
function makeScheduleRotation(pools){
  const sched=[];
  const byGym={};
  pools.forEach(p=>{ (byGym[p.gym]=byGym[p.gym]||[]).push(p); });
  const gymIndex=id=>GYMS.findIndex(g=>g.id===id);
  Object.keys(byGym).sort((a,b)=>gymIndex(a)-gymIndex(b)).forEach(gym=>{
    const courts=gymCourtList(gym, pools);
    const C=courts.length;
    const queues=byGym[gym].map(p=>({p, matches:roundRobin(p.teams.map(x=>x.t)).flat(), qi:0}));
    let tour=0, guard=0;
    while(queues.some(q=>q.qi<q.matches.length) && guard++<2000){
      tour++;
      const used=new Set();
      let free=C;
      let placedAny=true;
      while(free>0 && placedAny){
        placedAny=false;
        const order=queues.filter(q=>q.qi<q.matches.length)
          .sort((x,y)=>(y.matches.length-y.qi)-(x.matches.length-x.qi));
        for(const q of order){
          if(free<=0) break;
          const [a,b]=q.matches[q.qi];
          if(used.has(a)||used.has(b)) continue; // déjà engagée sur ce tour
          const court=courts[C-free];
          sched.push({r:tour, time:slotTime(tour), gym:gymName(gym), court, pool:q.p.letter, a, b, sa:undefined, sb:undefined, sets:null, status:'upcoming'});
          used.add(a); used.add(b); q.qi++; free--; placedAny=true;
        }
      }
    }
  });
  sched.sort((x,y)=> x.r-y.r || (x.gym<y.gym?-1:x.gym>y.gym?1:0) || x.court-y.court);
  return sched;
}
// Mode « poule par poule » : une poule occupe tous les terrains de son gymnase pour un tour, puis l'autre poule
function makeSchedulePool(pools){
  const sched=[];
  const byGym={};
  pools.forEach(p=>{ (byGym[p.gym]=byGym[p.gym]||[]).push(p); });
  const gymPlans={}; let maxTours=0;
  Object.keys(byGym).forEach(gym=>{
    const courts=gymCourtList(gym, pools);
    const poolRounds=byGym[gym].map(p=>({p, rounds:roundRobin(p.teams.map(x=>x.t)), idx:0}));
    const groups=[]; // chaque groupe = les matchs d'un même tour sur ce gymnase
    let remaining=poolRounds.reduce((a,q)=>a+q.rounds.length,0), gi=0, guard=0;
    while(remaining>0 && guard++<500){
      let picked=null;
      for(let t=0;t<poolRounds.length;t++){ const q=poolRounds[(gi+t)%poolRounds.length]; if(q.idx<q.rounds.length){ picked=q; gi=(gi+t+1)%poolRounds.length; break; } }
      if(!picked) break;
      const round=picked.rounds[picked.idx++]; remaining--;
      // si la poule a plus de matchs simultanés que de terrains, on découpe en sous-tours
      for(let off=0; off<round.length; off+=courts.length){
        const chunk=round.slice(off, off+courts.length);
        groups.push(chunk.map((pair,ci)=>({pool:picked.p, pair, court:courts[ci]})));
      }
    }
    gymPlans[gym]=groups; maxTours=Math.max(maxTours, groups.length);
  });
  for(let t=0;t<maxTours;t++){
    Object.keys(gymPlans).forEach(gym=>{
      const grp=gymPlans[gym][t]; if(!grp) return;
      grp.forEach(({pool,pair,court})=>{
        const [a,b]=pair;
        sched.push({r:t+1, time:slotTime(t+1), gym:gymName(gym), court, pool:pool.letter, a, b, sa:undefined, sb:undefined, sets:null, status:'upcoming'});
      });
    });
  }
  sched.sort((x,y)=> x.r-y.r || (x.gym<y.gym?-1:x.gym>y.gym?1:0) || x.court-y.court);
  return sched;
}

/* ---------- Phase 2 (Principale / Consolante) & phases finales ---------- */
function distributeCourts(pools, forceGym){
  const G=state.config.gyms, cpg=state.config.courtsPerGym||[];
  if(forceGym!=null){ // toute la catégorie dans un seul gymnase
    const gi=Math.min(G-1, forceGym), c=Math.max(1, cpg[gi]||1);
    pools.forEach((p,i)=>{ p.gym=GYMS[gi].id; p.court=(i%c)+1; });
    return;
  }
  const P=pools.length, perGym=Math.ceil(P/Math.max(1,G));
  const gymCourts=[];
  for(let gi=0;gi<G;gi++) gymCourts.push(Math.max(1,cpg[gi]||1));
  pools.forEach((p,i)=>{ const gi=Math.min(G-1,Math.floor(i/perGym)); p.gym=GYMS[gi].id; const k=i-gi*perGym; p.court=(k%gymCourts[gi])+1; });
}
// Tête de série d'une poule de brassage = son équipe au niveau le plus fort
// (recalculé à la demande plutôt que stocké, pour rester juste même après un
// déplacement manuel d'équipe entre poules).
function poolSeedTeam(p){
  if(!p || !p.teams.length) return null;
  let top=p.teams[0];
  p.teams.forEach(x=>{ if(levelMeta(x.level).w>levelMeta(top.level).w) top=x; });
  return top.t;
}
// 1ers & 2es de chaque poule → Principale ; le reste → Consolante — sauf

// n'est pas remplie par les seuls 1ers/2es, les meilleurs 3es (classés comme
// au tableau : points puis différence de points, à égalité) sont promus en
// Principale ("meilleur 3ème") jusqu'à la remplir ; les 3es non repêchés et
// tous les 4es+ partent en Consolante.
// `isSeed` marque la tête de série de la poule d'origine : utilisé en phase 2
// pour éviter de regrouper deux têtes de série encore invaincues.
function splitQualifiers(pools, schedule){
  const principal=[], consolante=[], thirds=[];
  (pools||[]).forEach(p=>{
    const seedName=poolSeedTeam(p);
    poolStandingRows(p, schedule).forEach((r,i)=>{
      const lvl=(p.teams.find(x=>x.t===r.t)||{}).level||'dep';
      const team={t:r.t, level:lvl, seed:i, from:p.letter, isSeed:r.t===seedName};
      if(i<2) principal.push(team);
      else if(i===2) thirds.push({team, pts:r.pts, diff:r.pf-r.pc});
      else consolante.push(team);
    });
  });
  const T=state.config.teamsPerPool||4;
  const target=(state.config.principalPools||4)*T;
  const need=Math.max(0, target-principal.length);
  thirds.sort((a,b)=> b.pts-a.pts || b.diff-a.diff || a.team.t.localeCompare(b.team.t));
  thirds.forEach((x,i)=>{

  });

// Répartit les qualifiés dans les poules de phase 2 poule d'origine par poule

// on choisit M poules de phase 2 toutes différentes parmi les moins
// chargées — ce qui garantit par construction qu'aucune collision
// (deux équipes de la même poule de brassage dans la même poule de phase 2)

// un pointeur tournant (ptr) répartit équitablement les égalités d'une poule
// d'origine à l'autre. Les poules d'origine ayant encore une tête de série

// qualifiés égal, pour répartir ces têtes de série le plus uniformément

function seedPhase2Pools(teams, P, letters){
  const L=letters||POOL_LETTERS;
  const pools=[]; for(let i=0;i<P;i++) pools.push({letter:L[i]||('P'+(i+1)),gym:null,court:1,teams:[]});
  // Traite les qualifiés NIVEAU DE CLASSEMENT par niveau de classement (tous les
  // 1ers de poule d'abord, puis tous les 2es, puis les éventuels repêchés) plutôt
  // que poule d'origine par poule d'origine : chaque équipe prend alors la poule
  // la moins chargée parmi celles ne contenant pas déjà une équipe de sa poule
  // de brassage d'origine (jamais deux équipes de la même poule d'origine dans
  // la même poule de phase 2, sauf si vraiment impossible à éviter). Un
  // regroupement poule d'origine par poule d'origine pouvait, à charge égale,
  // empiler plusieurs 1ers de poule dans la même poule de phase 2 pendant
  // qu'une autre n'héritait que de 3es — ce tri par niveau l'évite.

  teams.forEach(t=>{ if(!bySeed.has(t.seed)) bySeed.set(t.seed, []); bySeed.get(t.seed).push(t); });

    const members=bySeed.get(seed).slice().sort((a,b)=>(b.isSeed?1:0)-(a.isSeed?1:0));

      const eligible=pools.filter(p=>!p.teams.some(x=>x.from===team.from));

  // sur certaines compositions de poules d'origine, forcer plusieurs équipes
  // d'une même poule d'origine vers la seule poule de phase 2 qui leur reste
  // éligible, créant un écart de taille supérieur au minimum possible (ex. une
  // poule à 5 pendant qu'une autre reste à 2). On déplace alors une équipe de
  // la poule la plus chargée vers la moins chargée (sans jamais créer de

    emptiest.teams.push(team);
  }

}
function makeCategory(teams, forceGym, forceP, letters){

function buildPhase2(){

  const T=state.config.teamsPerPool||4;
  const nPrinc=state.config.principalPools||4;
  const nConso=state.config.phaseConsolante ? Math.max(1, Math.round(q.consolante.length/T)||1) : 0;
  // Lettres de phase 2 en ordre alphabétique INVERSE (Z, Y, X…) par rapport au

  // des lettres les plus proches de Z), puis la Principale l'enchaîne.
  const REV=POOL_LETTERS.slice().reverse();
  const consoLetters=REV.slice(0, nConso);
  const princLetters=REV.slice(nConso, nConso+nPrinc);
  // Principale : nombre de poules fixé par réglage (après repêchage des meilleurs 3es).
  state.phasePrincipal=makeCategory(q.principal, split?0:undefined, nPrinc, princLetters);

function ensurePhases(){ if(!state.phasePrincipal||!state.phaseConsolante) buildPhase2(); }

// Construit le payload {gyms,pools,matches} d'UNE phase (principal/consolante) pour

function buildPhaseStructure(phaseKey, cat){
  const gymNames=[...new Set((cat.pools||[]).map(p=>gymName(p.gym)))];
  return {
    gyms: gymNames.map(name=>({ name, position: Math.max(0, GYMS.findIndex(g=>gymName(g.id)===name)) })),
    pools: (cat.pools||[]).map(p=>({ letter:p.letter, phase:phaseKey, gymName:gymName(p.gym), court:p.court, teamKeys:p.teams.map(x=>x.t) })),
    matches: (cat.schedule||[]).map(m=>({ round:m.r, time:m.time, phase:phaseKey, poolKey:m.pool, gymName:m.gym, court:m.court, aKey:m.a, bKey:m.b, refKey:m.ref })),

// Répartit une structure rechargée (pools+matchs de TOUTES les phases, fusionnés par
// le serveur) dans les bons buckets d'état selon le champ `phase` — brassage dans
// state.pools/schedule, phase 2 dans phasePrincipal/phaseConsolante (avec leurs vrais

function applyLoadedStructure(fresh){
  if(!fresh || !fresh.schedule || !fresh.schedule.length) return false;
  const pools=fresh.pools||[], sched=fresh.schedule;
  const byPhase=ph=>({ pools: pools.filter(p=>(p.phase||'brassage')===ph), schedule: sched.filter(m=>(m.phase||'brassage')===ph) });
  const bra=byPhase('brassage');
  if(bra.pools.length) state.pools=bra.pools;
  if(bra.schedule.length) state.schedule=bra.schedule;

  // serveur n'a aucun match pour elle : ne jamais écraser avec un {pools:[],

  // liveRefreshTick) efface la proposition de répartition en cours d'édition
  // (ou déjà « Enregistrée » mais pas encore démarrée).
  const princ=byPhase('principal'); if(princ.schedule.length) state.phasePrincipal=princ;
  const conso=byPhase('consolante'); if(conso.schedule.length) state.phaseConsolante=conso;
  const brP=byPhase('finalesPrincipal'); if(brP.schedule.length) state.bracketPrincipal=brP;
  const brC=byPhase('finalesConsolante'); if(brC.schedule.length) state.bracketConsolante=brC;

function bracketSlotTime(round){

  const sh=(+parts[0])||9, sm=(+parts[1])||0;
  const per=((+c.roundMinutes)||20)+((+c.setupMinutes)||10);
  const t=(sh*60+sm)+((round||1)-1)*per, h=Math.floor(t/60)%24, m=t%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function buildBracketMatches(phaseKey, round, pairs){
  // Filtre les paires incomplètes : buildBracket() impose un minimum de 2 têtes de
  // série même quand le classement n'en fournit pas assez (ex: Consolante avec trop
  // peu de qualifiés) — on ne veut pas persister un match fantôme sans équipes.
  const valid=(pairs||[]).filter(([a,b])=>a&&b);
  const time=bracketSlotTime(round);
  return { gyms:[], pools:[], matches: valid.map(([a,b],i)=>({ round, time, phase:phaseKey, poolKey:null, gymName:null, court:i+1, aKey:a, bKey:b, refKey:null })) };
}
// Nom du tour affiché pour un match de bracket (ex: "1/4", "Finale"), déduit du nombre
// de matchs du 1er tour déjà persisté pour cette catégorie.
function bracketRoundLabel(m){
  if(m.phase==='finalesPrincipal3e'||m.phase==='finalesConsolante3e') return 'Petite finale (3e place)';
  const catKey = m.phase==='finalesConsolante' ? 'consolante' : 'principal';
  const round1Count=(bracketData(catKey).schedule||[]).filter(x=>x.r===1).length || 1;
  const K=Math.max(2, round1Count*2);
  return roundNames(K)[(m.r||1)-1] || 'Phase finale';
}
// Dès qu'une PAIRE de matchs d'un tour du bracket débouchant sur le même match
// du tour suivant est entièrement jouée, génère et persiste ce match suivant
// (vainqueurs appariés) — sans attendre que tout le tour soit terminé, pour que
// les autres faces-à-faces du tableau puissent démarrer dès que leurs deux
// qualifiés sont connus. Quand la paire concernée est la demi-finale (tour à
// 2 matchs), génère aussi le match de la 3e place entre les 2 perdants, dans sa
// propre mini-phase indépendante (sinon elle fausserait la détection de fin de
// tableau ci-dessus).
async function advanceBracketIfRoundDone(phaseKey){
  if(phaseKey==='finalesPrincipal3e'||phaseKey==='finalesConsolante3e') return; // match unique, terminal
  const catKey = phaseKey==='finalesConsolante' ? 'consolante' : 'principal';
  const sched=(bracketData(catKey).schedule||[]);
  if(!sched.length) return;
  const maxR=Math.max(...sched.map(m=>m.r||1));
  const cur=sched.filter(m=>m.r===maxR).sort((a,b)=>(a.court||0)-(b.court||0));
  if(cur.length<=1) return; // pas de tour, ou déjà la finale : rien à générer après
  const nextR=maxR+1;
  const existingNext=sched.filter(m=>m.r===nextR);
  const newMatches=[];
  for(let i=0;i*2+1<cur.length;i++){
    const m1=cur[i*2], m2=cur[i*2+1];
    if(!m1||!m2 || m1.status!=='done' || m2.status!=='done') continue; // paire pas encore complète
    if(existingNext.some(m=>m.court===i+1)) continue; // déjà généré (ré-saisie d'un score)
    const w1=matchWinner(m1)==='a'?m1.a:m1.b, w2=matchWinner(m2)==='a'?m2.a:m2.b;
    newMatches.push(...buildBracketMatches(phaseKey, nextR, [[w1,w2]]).matches.map(mm=>({...mm, court:i+1})));
    if(cur.length===2){
      const phase3e = phaseKey==='finalesConsolante' ? 'finalesConsolante3e' : 'finalesPrincipal3e';
      const already3e = (bracketData3e(catKey).schedule||[]).length>0;
      if(!already3e){
        const l1=matchWinner(m1)==='a'?m1.b:m1.a, l2=matchWinner(m2)==='a'?m2.b:m2.a;
        newMatches.push(...buildBracketMatches(phase3e, 1, [[l1,l2]]).matches);
      }
    }
  }
  if(!newMatches.length) return;
  const t=state.tournaments.find(x=>x.id===state.currentDraftId);
  if(window.vboDb && t && vboDb.isUuid(t.id)){
    await vboDb.addPhase(t.id, { gyms:[], pools:[], matches:newMatches });
    const fresh=await vboDb.loadStructure(t.id);
    applyLoadedStructure(fresh);
  }
}
// Bracket seedé depuis le classement global d'une catégorie (phase 2)
function seedOrder(n){ let r=[0]; while(r.length<n){ const m=r.length*2; const nr=[]; r.forEach(s=>{nr.push(s);nr.push(m-1-s);}); r=nr; } return r; }
function categoryRanking(cat){
  const rows=[]; cat.pools.forEach(p=> poolStandingRows(p, cat.schedule).forEach(r=> rows.push(r)) );
  rows.sort((a,b)=> b.pts-a.pts || (b.pf-b.pc)-(a.pf-a.pc) || a.t.localeCompare(b.t));
  return rows;
}
function roundNames(K){ const names=[]; let n=K; while(n>1){ names.push(n===2?'Finale':'1/'+(n/2)); n/=2; } return names; }
function buildBracket(cat){
  const rank=categoryRanking(cat);
  let autoK=1; while(autoK*2<=rank.length) autoK*=2; autoK=Math.max(2,autoK);
  const fs=state.config.finalStart||'auto';
  // Choix manuel (16=1/8, 8=1/4, 4=1/2) borné au nombre réel de qualifiés
  let K = fs==='auto' ? autoK : Math.min(+fs||autoK, autoK);
  K=Math.max(2,K);
  const seeds=rank.slice(0,K).map(r=>r.t);
  const order=seedOrder(K);
  const first=[]; for(let i=0;i<K/2;i++){ first.push([seeds[order[2*i]], seeds[order[2*i+1]]]); }
  return {K, first, seeds};
}
// Prépare les appariements du 1er tour affichés/éditables dans la fiche « Fin de
// phase » (nxt==='finales'), avec la même logique que ensurePhase2Proposal : on ne
// recalcule que si l'admin n'a pas déjà échangé des équipes à la main.
function ensureFinalesProposal(){
  if(state._finalesEdited && state._finalesProposal) return;
  const prop={};
  const prin=buildBracket(phaseData('principal'));
  prop.principal={K:prin.K, pairs:prin.first.map(p=>p.slice())};
  if(state.config.phaseConsolante){
    const cons=buildBracket(phaseData('consolante'));
    prop.consolante={K:cons.K, pairs:cons.first.map(p=>p.slice())};
  }
  state._finalesProposal=prop;
}
window.invalidateFinalesProposal=()=>{ state._finalesEdited=false; state._finalesProposal=null; };

}

// Historique navigateur : sans ça, le bouton « retour » du téléphone quitte
// directement l'appli pour le site du club (aucune entrée d'historique n'est
// jamais posée). On pose une entrée à chaque navigation interne (go), et on
// intercepte le popstate qui en résulte (retour matériel OU bouton « ‹ » de
// la topbar, qui passe lui aussi par history.back()) pour rejouer le back
// applicatif plutôt que de laisser le navigateur sortir de la page.
function applyBack(){
  navStack.pop();
  const prev = navStack[navStack.length-1] || {screen:'home',opts:{}};
  render(prev.screen, prev.opts);
  saveLastRoute(prev.screen, prev.opts);
}
function go(screen, opts={}){
  if(!opts.replace) navStack.push({screen,opts});
  render(screen,opts);
  if(opts.replace) history.replaceState({navLen:navStack.length}, '', location.href);
  else history.pushState({navLen:navStack.length}, '', location.href);
  saveLastRoute(screen,opts);
}
function back(){
  if(navStack.length>1) history.back(); // déclenche le popstate ci-dessous
  else applyBack();
}
window.addEventListener('popstate', ()=>{
  if(navStack.length>1) applyBack();
  // sinon : on est déjà sur le premier écran posé par l'appli — on laisse le
  // navigateur continuer vers l'historique d'avant son chargement.
});
document.getElementById('backBtn').onclick = back;

// Persistance de l'écran courant (admin/référent) pour qu'un rechargement de
// page (F5, fermeture accidentelle de l'onglet…) revienne là où on était au
// lieu de renvoyer à l'accueil du compte — cf. restoreLastRoute() dans boot().
const TAB_SCREENS=new Set(['orgLive','schedule','standings','validate','bracket']);
const RESUMABLE_ADMIN=new Set(['dashboard', ...TAB_SCREENS]);
const RESUMABLE_REF=new Set(['refSpace', ...TAB_SCREENS]);

// Navigation au doigt entre les 5 onglets de gestion d'un tournoi : glisser à
// droite avance dans l'ordre des onglets, glisser à gauche recule (et quitte
// vers « Mes tournois » depuis le premier onglet). Désactivé si le geste
// démarre dans une zone qui défile elle-même horizontalement (tableau de
// classement, bracket des finales) pour ne pas interférer avec ce défilement.
(function initTabSwipe(){
  const ORDER=[...TAB_SCREENS];
  const THRESH=60, RATIO=1.3;
  let sx=0, sy=0, tracking=false;
  function scrollsHorizontally(el){
    while(el && el!==host){
      if(el.scrollWidth > el.clientWidth + 2) return true;
      el=el.parentElement;
    }
    return false;
  }
  host.addEventListener('touchstart', e=>{
    tracking=false;
    if(tabbar.hidden || e.touches.length!==1) return;
    if(scrollsHorizontally(e.target)) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true;
  }, {passive:true});
  host.addEventListener('touchend', e=>{
    if(!tracking) return; tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<THRESH || Math.abs(dx)<Math.abs(dy)*RATIO) return;
    const cur=navStack[navStack.length-1];
    if(!cur || !TAB_SCREENS.has(cur.screen)) return;
    const idx=ORDER.indexOf(cur.screen);
    if(dx>0){ if(idx<ORDER.length-1) go(ORDER[idx+1]); }
    else{ if(idx>0) go(ORDER[idx-1]); else go(state.refSession?'refSpace':'dashboard'); }
  }, {passive:true});
})();

function saveLastRoute(screen, opts){
  try{
    if(state.authed && RESUMABLE_ADMIN.has(screen)){
      localStorage.setItem('vbo_route_admin', JSON.stringify({screen, opts, tid:state.currentDraftId||null}));
    }else if(state.refSession && RESUMABLE_REF.has(screen)){
      localStorage.setItem('vbo_route_ref', JSON.stringify({screen, opts, tid:state.currentDraftId||null}));
    }
  }catch(e){}
}
async function restoreLastRoute(key){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(key)||'null'); }catch(e){}
  if(!saved || !saved.screen) return false;
  try{
    if(TAB_SCREENS.has(saved.screen) && saved.tid){
      await refreshTournaments();
      const t=state.tournaments.find(x=>x.id===saved.tid);
      if(t && t.status==='live'){ await openTournament(t.id, saved.screen); return true; }
      return false; // tournoi introuvable/plus en direct : repli sur l'accueil
    }
    if(saved.screen==='dashboard'){ go('dashboard'); return true; }
    if(saved.screen==='refSpace'){ await refreshTournaments(); go('refSpace'); return true; }
  }catch(e){ console.warn('Restauration écran:', e); }
  return false;
}

// Bascule thème clair/sombre, valable pour tous les profils (admin, référent,
// capitaine) — persistée dans localStorage, indépendante par appareil. Pas de
// bouton flottant global (ça finissait au-dessus d'un bouton d'en-tête selon
// l'écran) : le bouton est inséré dans chaque en-tête via themeToggleBtn().
function currentTheme(){
  const t=document.documentElement.getAttribute('data-theme');
  if(t==='light'||t==='dark') return t;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light';
}
function themeToggleBtn(){
  return `<button class="btn ghost sm theme-toggle" aria-label="Changer de thème" onclick="toggleTheme()">${currentTheme()==='dark'?'☀️':'🌙'}</button>`;
}
function syncThemeIcon(){
  document.querySelectorAll('.theme-toggle').forEach(btn=>{ btn.textContent = currentTheme()==='dark' ? '☀️' : '🌙'; });
}
window.toggleTheme=()=>{
  const next = currentTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('vbo_theme', next); }catch(e){}
  syncThemeIcon();
};
topbar.insertAdjacentHTML('beforeend', themeToggleBtn());
syncThemeIcon();

}

function tournPhaseInfo(t){

/* ---------- Création wizard ---------- */
let wizStep = 0;
const WIZ_STEPS = ['Infos','Format & gymnases','Règles de match','Phases'];
// Parcours complet de création (barre d'avancement commune à tous les écrans)
const CREATE_STEPS = ['Infos','Format','Règles','Phases','Inscriptions','Répartition','Lancement'];
function createProgArr(idx){ return CREATE_STEPS.map((_,i)=> i<idx?'done': i===idx?'cur':''); }
// Étape réelle du parcours de création (0-3 = wizard, 4 = inscriptions, 5 = répartition, 6 = lancement)
let createStage = 0;
function startWizard(){ wizStep=0; createStage=0; state.currentDraftId=null; go('wizard'); }
/* ----- Brouillons : sauvegarde / reprise à chaque étape ----- */
function snapshotTournament(){
  return {
    config: JSON.parse(JSON.stringify(state.config)),
    gyms: GYMS.slice(0, state.config.gyms).map(g=>g.name),
    teams: state.teams.map(t=>({name:t.name, level:t.level})),
    step: createStage,
  };
}
async function saveDraft(exit){
  saveWizard();
  const snap=snapshotTournament();
  let d=state.tournaments.find(x=>x.id===state.currentDraftId);
  if(!d){ d={id:'d'+Date.now(), status:'draft', archived:false}; state.tournaments.push(d); state.currentDraftId=d.id; }
  Object.assign(d, snap, {id:d.id, savedAt:Date.now()});
  if(!d.status) d.status='draft';
  if(window.vboDb){
    try{
      const newId = await vboDb.save(d);
      if(newId && newId!==d.id){ const old=d.id; d.id=newId; if(state.currentDraftId===old) state.currentDraftId=newId; }
    }catch(e){ console.warn('Enregistrement brouillon:', e); toast('⚠️ Enregistrement cloud échoué'); }
  }
  toast('💾 Brouillon enregistré');
  if(exit){ state._tournLoaded=false; go('dashboard'); }
}
function resumeDraft(id){
  const d=state.tournaments.find(x=>x.id===id); if(!d) return;
  Object.assign(state.config, d.config);
  (d.gyms||[]).forEach((nm,i)=>{ if(GYMS[i]) GYMS[i].name=nm; });
  state.teams = (d.teams||[]).map(t=>({name:t.name, level:t.level}));
  state.currentDraftId=id;
  const st=d.step||0; createStage=st;
  if(st<=3){ wizStep=st; go('wizard'); }
  else { wizStep=3; rebuildPools(); go(st===4?'teamsRegister':st===5?'assignPools':'summary'); }
}
// Lancement : enregistre le tournoi dans la liste (statut « En cours ») puis génère le QR
async function launchTournament(){
  saveWizard();
  const snap=snapshotTournament();
  let t=state.tournaments.find(x=>x.id===state.currentDraftId);
  if(!t){ t={id:'t'+Date.now()}; state.tournaments.push(t); state.currentDraftId=t.id; }
  // Code propre à CE tournoi : on réutilise le sien s'il en a déjà un (relance),
  // sinon on en génère un nouveau — jamais celui, périmé, d'un autre tournoi déjà
  // consulté dans cette session (state.joinCode est un global, pas par tournoi).
  state.joinCode = t.joinCode || genUniqueJoinCode();
  state.livePhase='brassage';
  Object.assign(t, snap, {id:t.id, status:'live', archived:false, joinCode:state.joinCode, launchedAt:Date.now(), livePhase:'brassage'});
  if(window.vboDb){
    try{
      const newId = await vboDb.save(t, { launched_at:new Date(t.launchedAt).toISOString() });
      if(newId && newId!==t.id){ const old=t.id; t.id=newId; if(state.currentDraftId===old) state.currentDraftId=newId; }
      // Phase 2 : persiste gymnases / équipes / poules / matchs de brassage.
      if(vboDb.isUuid(t.id)){
        const gymsUsed=[...new Set(state.pools.map(p=>p.gym))];
        const structure={
          gyms: gymsUsed.map(gid=>({ key:gid, name:gymName(gid), position:Math.max(0,GYMS.findIndex(g=>g.id===gid)) })),
          teams: state.teams.map(tm=>({ key:tm.name, name:tm.name, levelW:levelMeta(tm.level).w })),
          pools: state.pools.map(p=>({ letter:p.letter, phase:'brassage', gymKey:p.gym, court:p.court, teamKeys:p.teams.map(x=>x.t) })),
          matches: (state.schedule||[]).map(m=>({ round:m.r, time:m.time, phase:'brassage', poolKey:m.pool, gymName:m.gym, court:m.court, aKey:m.a, bKey:m.b, refKey:m.ref })),
        };
        try{
          await vboDb.saveStructure(t.id, structure);
          // Recharge immédiatement : récupère les id réels des matchs (nécessaires
          // pour la saisie de score admin/référent), comme le fait openTournament().
          const fresh=await vboDb.loadStructure(t.id);
          applyLoadedStructure(fresh);
          state.loadedStructTid=t.id;
        }
        catch(e){ console.warn('Persistance structure:', e); toast('⚠️ Structure non enregistrée (tournoi créé)'); }
      }
    }catch(e){ console.warn('Lancement tournoi:', e); toast('⚠️ Enregistrement cloud échoué'); }
  }
  go('qr');
}

  // Règles de match — phase de brassage
  if(g('b_sets')) state.config.sets=+g('b_sets').value;
  if(g('b_pts')) state.config.pointsPerSet=+g('b_pts').value;
  if(g('b_min')) state.config.setMinutes=+g('b_min').value;
  if(g('sw_b_timed')) state.config.timed=g('sw_b_timed').classList.contains('on');
  if(g('sw_b_gap')) state.config.twoPointGap=g('sw_b_gap').classList.contains('on');
  if(g('w_winpts')) state.config.winPts=+g('w_winpts').value;
  if(g('w_losspts')) state.config.lossPts=+g('w_losspts').value;
  if(g('sw_conso')) state.config.phaseConsolante=g('sw_conso').classList.contains('on');
  if(g('w_principalPools')) state.config.principalPools=+g('w_principalPools').value;
  if(g('w_finalStart')) state.config.finalStart=g('w_finalStart').value;
  // Noms + nombre de terrains par gymnase
  document.querySelectorAll('input[id^="w_gymname_"]').forEach(el=>{ const i=+el.id.replace('w_gymname_',''); if(GYMS[i]&&el.value.trim()) GYMS[i].name=el.value.trim(); });
  const gc=[];
  document.querySelectorAll('input[id^="w_gymcourts_"]').forEach(el=>{ gc[+el.id.replace('w_gymcourts_','')]=+el.value; });
  state.config.courtsPerGym = Array.from({length:state.config.gyms},(_,i)=> gc[i]||state.config.courtsPerGym[i]||3);
  state.config.courts = state.config.courtsPerGym.reduce((a,b)=>a+b,0);
}

// Nombre de qualifiés en Principale = 1ers + 2es de chaque poule (partage par rang)
function principalQualCount(){
  const n=(state.pools||[]).reduce((s,p)=> s+Math.min(2,(p.teams||[]).length), 0);
  return n || Math.floor((C.teams||0)/2);
}
function autoFinalLabel(){
  const qual=principalQualCount();
  let K=1; while(K*2<=qual) K*=2; K=Math.max(2,K); // plus grande puissance de 2 ≤ qualifiés
  return {K, qual, label: K===2?'Finale directe':'1/'+(K/2)+' de finale ('+K+' équipes)'};
}

        : `<label class="field" style="margin:0"><span>Équipes / poule</span>${numCtl('ap_tpp',C.teamsPerPool,2,8)}</label>`}

    <div class="seg seg-strong" id="distSeg">${methods.map(m=>`<button class="${state.config.distribution===m[0]?'on':''}" onclick="setDist('${m[0]}')">${m[1]}</button>`).join('')}</div>

    ${state.config.distribution!=='manual'?`<button class="btn ghost sm" style="margin:12px 0 4px" onclick="rebuildPools();screens.assignPools();toast('Nouvelle répartition générée')">🔄 Régénérer</button>`:''}`;
  GYMS.slice(0,G).forEach(g=>{
    const gp = state.pools.filter(p=>p.gym===g.id);

      h+=`</ul></div>`;
